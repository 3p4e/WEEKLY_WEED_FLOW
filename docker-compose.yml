# ════════════════════════════════════════════════════════════════════════
#  WEEKLY_WEED_FLOW — deployed stack (mirrors what runs on KVM4)
#
#    db-users  Postgres 17 — identity data (organizations, profiles,
#              password_reset_codes) + its own hash-chained audit trail
#    db-tasks  Postgres 17 — all work data (tasks, work_sessions, pins, ...)
#              + its own hash-chained audit trail
#    backend   FastAPI API (asyncpg, JWT, RLS) on :8000 — internal only
#    frontend  nginx serving the GrowFlow UI (web/) and reverse-proxying
#              /auth /departments /weeks /tasks /sessions /capture /ai /audit
#              /reports to the backend; published over HTTPS by Traefik.
#    db-backup rotating local pg_dump backups of BOTH databases plus a tarball
#              of the DocEngine output volume — docs/BACKUP.md
#    docengine GrowFlow DocEngine (docengine/): the document AI service behind
#              /qms/studio/* and COQ generation — internal only, registry in
#              schema `docengine` of wwf_tasks, artefacts in docengine_out
#    capture-mcp remote MCP connector for claude.ai/Cowork auto-delivery of
#              task captures (secret path, single-purpose token)
#
#  The always-on Letta agent layer (AI functions) runs in its own pre-existing
#  stack (letta-6ou3) and is reached over the external `ai-net` network — it
#  is intentionally NOT defined or managed here.
#
#  RESOURCE LIMITS — every service now carries mem_limit + cpus. They had
#  none, so any one container could take the whole host down with it: the
#  single-host stack has no scheduler to arbitrate, and an OOM there kills
#  whatever the kernel picks, not whatever misbehaved.
#
#  These are BLAST-RADIUS CAPS, not measured working sets — nothing here was
#  profiled under production load, and they are deliberately set well above
#  expected usage so they bite only on runaway behaviour. db-tasks gets the
#  most (all work data, the QC LIMS tables and both audit chains live there);
#  frontend the least (nginx serving static files). If a service is being
#  OOM-killed, the limit is wrong for the real workload — raise it rather than
#  assuming the service is at fault.
#
#  NOTE — this file faithfully describes the architecture (images, names,
#  labels, networks) but is not a turnkey `up`: the app_user / app_admin login
#  roles (the latter BYPASSRLS) and their table GRANTs are a one-time bootstrap
#  in EACH database, separate from the schema files (which carry only structure
#  + RLS + the audit trigger). See docs/DEPLOY.md. Production was provisioned
#  this way out-of-band, not via `compose up`.
# ════════════════════════════════════════════════════════════════════════
name: weekly_weed_flow

services:
  db-users:
    image: postgres:17-alpine
    mem_limit: 1g
    cpus: '1.0'
    container_name: wwf-db-users
    environment:
      - POSTGRES_DB=wwf_users
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - wwf_users_pgdata:/var/lib/postgresql/data
      - ./backend/schema.users.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [internal]
    restart: unless-stopped

  db-tasks:
    image: postgres:17-alpine
    mem_limit: 2g
    cpus: '2.0'
    container_name: wwf-db-tasks
    environment:
      - POSTGRES_DB=wwf_tasks
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - wwf_tasks_pgdata:/var/lib/postgresql/data
      - ./backend/schema.tasks.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [internal]
    restart: unless-stopped

  backend:
    build: ./backend
    mem_limit: 1g
    cpus: '2.0'
    image: weekly_weed_flow-backend:latest
    container_name: weekly_weed_flow-backend-1
    depends_on: [db-users, db-tasks]
    env_file: .env
    # Trust X-Forwarded-For ONLY from the frontend nginx's fixed IP (below),
    # never '*' — a wildcard would let any container on this shared network
    # (incl. the internet-exposed capture-mcp) spoof its source IP and defeat
    # the login rate-limiter. uvicorn reads FORWARDED_ALLOW_IPS with --proxy-headers.
    #
    # The chain is client -> Traefik -> nginx -> uvicorn. uvicorn takes the
    # RIGHTMOST address in X-Forwarded-For that is not in this list, so nginx
    # must forward Traefik's header ("<client>") UNCHANGED rather than append
    # Traefik's own address to it — appending made every request resolve to
    # Traefik, and the whole facility shared one login-limiter bucket (review
    # 2026-09-27, BC-01). web/nginx.conf does that; Traefik's network is an
    # external one whose subnet this file does not know, so Traefik itself is
    # deliberately NOT listed here — nginx tells Traefik's traffic apart by
    # the interface it arrives on instead.
    environment:
      - FORWARDED_ALLOW_IPS=172.16.31.20
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the Letta stack on the host
    expose: ["8000"]
    # H12 — this service has no Traefik labels (only `frontend` does), so the
    # "Traefik won't route unhealthy containers" rationale never applied here:
    # nothing detected a wedged-but-alive backend. /health/ready round-trips
    # BOTH databases, which is the difference between "process is up" and
    # "can actually serve". Python rather than curl: the slim image has no curl.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [internal]
    restart: unless-stopped

  scheduler:
    build: ./backend
    mem_limit: 768m
    cpus: '1.0'
    image: weekly_weed_flow-backend:latest
    container_name: wwf-scheduler
    depends_on: [db-users, db-tasks]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the Letta stack on the host
    command: ["python", "scripts/scheduler.py"]
    # H12 — the scheduler has no HTTP surface, and "the process is running"
    # says nothing about whether its loop still turns; a wedged loop silently
    # stops firing the weekly snapshot. scheduler.py touches the heartbeat on
    # every wake and the sleep is capped at 30 min, so >35 min without a
    # heartbeat means the loop has stopped.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,sys,time; p='/tmp/wwf-scheduler-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 2100 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks: [internal]
    restart: unless-stopped

  frontend:
    build: ./web
    mem_limit: 256m
    cpus: '0.5'
    image: wwf-growflow:latest
    container_name: wwf-gf-frontend
    depends_on: [backend]
    # Fixed IP so the backend can trust X-Forwarded-For from exactly this proxy
    # (FORWARDED_ALLOW_IPS above) rather than the whole subnet.
    networks:
      internal:
        ipv4_address: 172.16.31.20
      traefik: {}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.wwf.rule=Host(`${APP_HOST:-wwf.srv1231216.hstgr.cloud}`)"
      - "traefik.http.routers.wwf.entrypoints=websecure"
      - "traefik.http.routers.wwf.tls.certresolver=letsencrypt"
      - "traefik.http.services.wwf.loadbalancer.server.port=80"
    restart: unless-stopped

  # Rotating local pg_dump backups of both databases — see docs/BACKUP.md for
  # scope, retention, the documented no-offsite-copy risk, non-atomicity
  # across the two dumps, and the restore procedure.
  db-backup:
    image: postgres:17-alpine
    mem_limit: 512m
    cpus: '1.0'
    container_name: wwf-db-backup
    depends_on: [db-users, db-tasks]
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?set in .env}   # same superuser pw in both DB containers
      - PGUSER=postgres
      - USERS_PGHOST=wwf-db-users
      - TASKS_PGHOST=wwf-db-tasks
      - USERS_PGDATABASE=wwf_users
      - TASKS_PGDATABASE=wwf_tasks
      - RETENTION_DAYS=14
    volumes:
      - ./backend/scripts/db_backup.sh:/usr/local/bin/db_backup.sh:ro
      - weekly_weed_flow_backups:/backups
      # Read-only view of the DocEngine's produced documents, archived beside
      # the dumps of the registry that names them (docs/BACKUP.md).
      - docengine_out:/docengine-out:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/db_backup.sh"]
    networks: [internal]
    restart: unless-stopped

  # GrowFlow DocEngine — the document AI service (docengine/): questionnaire
  # -> gf_* Letta fleet -> per-section regulatory check -> §6A audit ->
  # pp_verify PASS gate -> registry row (schema `docengine` in wwf_tasks,
  # created by the service at startup under its own role — docs/DEPLOY.md,
  # "DocEngine database role"). INTERNAL ONLY: the backend's /qms/studio
  # proxy and the certificate pipeline are its only callers, with X-API-Key
  # injected server-side. It reaches Letta (letta-6ou3) and Gotenberg over
  # the external `ai-net` network, exactly as the host's compose.yaml does.
  # Its environment is docengine.env (DOCENGINE_*, LETTA_*, RAGFLOW_*,
  # GOTENBERG_URL — see .env.example), kept apart from app.env so the Letta
  # and RAGflow tenant keys never sit in the backend's environment. The file
  # is `required: false` only so CI can validate this compose with just
  # .env present; on the host it must exist, and the healthcheck says so:
  # without it /health answers db:false and the service reads unhealthy.
  docengine:
    build: ./docengine
    mem_limit: 1g
    cpus: '1.0'
    image: growflow-docengine:latest
    container_name: wwf-docengine
    depends_on: [db-tasks]
    env_file:
      - path: docengine.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8000"]
    volumes:
      - docengine_out:/data/docengine-out
    # /health is liveness plus the readiness facts beside it. `db` is the
    # registry pool: without it every workflow answers 503 and a /build
    # registers nothing, so a process that is up but cannot reach its
    # registry is NOT healthy. Letta/RAGflow reachability is reported there
    # too (and by ops/watchdog.sh as a WARN) but does not flip the container
    # unhealthy — an upstream outage is not a reason to restart this one.
    # Python rather than curl: the slim image has no curl.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,sys,urllib.request; b=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)); sys.exit(0 if b.get('ok') and b.get('db') else 1)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks: [internal, ainet]
    restart: unless-stopped

  # Nightly OFFSITE copy of the local dumps — rclone `copy` (never `sync`, so
  # a local wipe cannot propagate) to an encrypted (rclone crypt) folder on
  # Google Drive. rclone.conf lives on the host at ./rclone/ (mode 0600,
  # git-ignored) holding the Drive OAuth token + crypt password pair. Remote
  # retention 60 days, independent of the local 14. Setup, restore drill and
  # crypt-key custody: docs/BACKUP.md "Offsite copy".
  backup-offsite:
    image: rclone/rclone:1
    mem_limit: 512m
    cpus: '1.0'
    container_name: wwf-backup-offsite
    depends_on: [db-backup]
    environment:
      - OFFSITE_RETENTION_DAYS=60
    volumes:
      - ./backend/scripts/offsite_backup.sh:/usr/local/bin/offsite_backup.sh:ro
      - ./rclone:/config/rclone
      - weekly_weed_flow_backups:/backups:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/offsite_backup.sh"]
    networks: [internal]
    restart: unless-stopped

  # Capture connector — remote MCP server claude.ai/Cowork chats call to
  # deliver Master-Capture-Prompt output straight into /capture/import.
  # Reachable only at a secret path behind Traefik TLS; holds a single
  # narrowly-scoped token (valid only on /capture/import). Deployment of
  # this public-but-secret-path service was explicitly user-approved.
  capture-mcp:
    build: ./connector
    mem_limit: 512m
    cpus: '1.0'
    image: wwf-capture-mcp:latest
    container_name: wwf-capture-mcp
    depends_on: [backend]
    environment:
      - WWF_IMPORT_URL=http://weekly_weed_flow-backend-1:8000/capture/import
      - CAPTURE_IMPORT_TOKEN=${CAPTURE_IMPORT_TOKEN:?set in .env}
      - MCP_PATH=${CAPTURE_MCP_PATH:?set in .env}
    networks: [internal, traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.wwfmcp.rule=Host(`${APP_HOST:-wwf.srv1231216.hstgr.cloud}`) && PathPrefix(`${CAPTURE_MCP_PATH:?set in .env}`)"
      - "traefik.http.routers.wwfmcp.entrypoints=websecure"
      - "traefik.http.routers.wwfmcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.wwfmcp.loadbalancer.server.port=8000"
    restart: unless-stopped

networks:
  internal:
    name: weekly_weed_flow_internal
    # Fixed subnet so the frontend can hold a stable IP the backend trusts for
    # X-Forwarded-For (see frontend.ipv4_address / backend.FORWARDED_ALLOW_IPS).
    ipam:
      config:
        - subnet: 172.16.31.0/24
  traefik:
    name: traefik_network
    external: true
  # The Letta stack's network (letta-6ou3, RAGflow, Gotenberg). External:
  # owned by that stack, joined here by docengine (and on the host by the
  # backend and scheduler too — docs/LETTA-CUTOVER-PHASE1-2026-08-22.md).
  ainet:
    name: ai-net
    external: true

volumes:
  wwf_users_pgdata:
  wwf_tasks_pgdata:
  weekly_weed_flow_backups:
  # Every controlled document DocEngine produced; the registry rows point
  # into it. Backed up by db-backup (docs/BACKUP.md). Never prune.
  docengine_out:
