# ════════════════════════════════════════════════════════════════════════
#  WEEKLY_WEED_FLOW — deployed stack (mirrors what runs on KVM4)
#
#    db-users  Postgres 17 — identity data (organizations, profiles,
#              password_reset_codes) + its own hash-chained audit trail
#    db-tasks  Postgres 17 — all work data (tasks, work_sessions, pins, ...)
#              + its own hash-chained audit trail
#    backend   FastAPI API (asyncpg, JWT, RLS) on :8000 — internal only
#    frontend  nginx serving the GrowFlow UI (web/) and reverse-proxying
#              /auth /departments /weeks /tasks /sessions /ai /audit /reports
#              to the backend; published over HTTPS by Traefik (Let's Encrypt).
#    db-backup rotating local pg_dump backups of BOTH databases — docs/BACKUP.md
#
#  The always-on Letta agent layer (AI functions) runs in its own pre-existing
#  stack and is reached over host.docker.internal — it is intentionally NOT
#  defined or managed here.
#
#  NOTE — this file faithfully describes the architecture (images, names,
#  labels, networks) but is not a turnkey `up`: the app_user / app_admin login
#  roles (the latter BYPASSRLS) and their table GRANTs are a one-time bootstrap
#  in EACH database, separate from the schema files (which carry only structure
#  + RLS + the audit trigger). See docs/DEPLOY.md. Production was provisioned
#  this way out-of-band, not via `compose up`.
# ════════════════════════════════════════════════════════════════════════
name: weekly_weed_flow

services:
  db-users:
    image: postgres:17-alpine
    container_name: wwf-db-users
    environment:
      - POSTGRES_DB=wwf_users
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - wwf_users_pgdata:/var/lib/postgresql/data
      - ./backend/schema.users.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [internal]
    restart: unless-stopped

  db-tasks:
    image: postgres:17-alpine
    container_name: wwf-db-tasks
    environment:
      - POSTGRES_DB=wwf_tasks
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - wwf_tasks_pgdata:/var/lib/postgresql/data
      - ./backend/schema.tasks.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [internal]
    restart: unless-stopped

  backend:
    build: ./backend
    image: weekly_weed_flow-backend:latest
    container_name: weekly_weed_flow-backend-1
    depends_on: [db-users, db-tasks]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the Letta stack on the host
    expose: ["8000"]
    networks: [internal]
    restart: unless-stopped

  scheduler:
    build: ./backend
    image: weekly_weed_flow-backend:latest
    container_name: wwf-scheduler
    depends_on: [db-users, db-tasks]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the Letta stack on the host
    command: ["python", "scripts/scheduler.py"]
    networks: [internal]
    restart: unless-stopped

  frontend:
    build: ./web
    image: wwf-growflow:latest
    container_name: wwf-gf-frontend
    depends_on: [backend]
    networks: [internal, traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.wwf.rule=Host(`${APP_HOST:-wwf.srv1231216.hstgr.cloud}`)"
      - "traefik.http.routers.wwf.entrypoints=websecure"
      - "traefik.http.routers.wwf.tls.certresolver=letsencrypt"
      - "traefik.http.services.wwf.loadbalancer.server.port=80"
    restart: unless-stopped

  # Rotating local pg_dump backups of both databases — see docs/BACKUP.md for
  # scope, retention, the documented no-offsite-copy risk, non-atomicity
  # across the two dumps, and the restore procedure.
  db-backup:
    image: postgres:17-alpine
    container_name: wwf-db-backup
    depends_on: [db-users, db-tasks]
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?set in .env}   # same superuser pw in both DB containers
      - PGUSER=postgres
      - USERS_PGHOST=wwf-db-users
      - TASKS_PGHOST=wwf-db-tasks
      - USERS_PGDATABASE=wwf_users
      - TASKS_PGDATABASE=wwf_tasks
      - RETENTION_DAYS=14
    volumes:
      - ./backend/scripts/db_backup.sh:/usr/local/bin/db_backup.sh:ro
      - weekly_weed_flow_backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/db_backup.sh"]
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    name: weekly_weed_flow_internal
  traefik:
    name: traefik_network
    external: true

volumes:
  wwf_users_pgdata:
  wwf_tasks_pgdata:
  weekly_weed_flow_backups:
