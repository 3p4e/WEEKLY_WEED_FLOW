# Two independent migration chains — one per database (see docs/DEPLOY.md).
# Invoke with the section name:
#   alembic -c backend/alembic.ini -n users upgrade head
#   alembic -c backend/alembic.ini -n tasks upgrade head
# Each env.py reads its own connection URL from the environment:
#   users → USERS_MIGRATION_DATABASE_URL
#   tasks → TASKS_MIGRATION_DATABASE_URL
# (DDL needs a role with schema-change privileges — app_user/app_admin are
# DML-only, so migrations never use the app's own DSNs.)

[users]
script_location = %(here)s/alembic_users
prepend_sys_path = .
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[tasks]
script_location = %(here)s/alembic_tasks
prepend_sys_path = .
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
