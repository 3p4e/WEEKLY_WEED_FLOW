# Local / dev reproduction of the WEEKLY_WEED_FLOW stack:
#   db  (Postgres + pgvector, RLS roles, audit trigger)  +  backend API.
#
#   cp .env.example .env   &&   docker compose up -d --build
#
# Production on KVM4 runs these as standalone containers behind Traefik
# (TLS via Let's Encrypt) on a shared docker network — see README.md. The
# always-on Letta agent layer (AI functions) runs in its own pre-existing
# stack and is reached over host.docker.internal, so it is not defined here.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: weekly_weed_flow-db-1
    environment:
      - POSTGRES_DB=weekly_weed_flow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - wwf_db:/var/lib/postgresql/data
      # schema.sql defines tables, RLS policies and the hash-chained audit
      # trigger. NOTE: the app_user / app_admin login roles (the latter with
      # BYPASSRLS) are cluster-level and must be created separately before the
      # API can connect — they are not part of this schema dump.
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    restart: unless-stopped

  backend:
    build: .
    container_name: weekly_weed_flow-backend-1
    depends_on:
      - db
    env_file: .env
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  wwf_db:
