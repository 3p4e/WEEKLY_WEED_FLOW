[pytest]
asyncio_mode = auto
testpaths = tests
# The connection-pool fixture (conftest.py) is session-scoped, so the whole
# test session must share one event loop — otherwise asyncpg pool
# connections created on one loop get used from another and raise
# "Task attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
