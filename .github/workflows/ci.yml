name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend deps + import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Import app (route check)
        working-directory: backend
        run: python -c "import main; print('routes:', len(main.app.routes))"

  images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -t wwf-gateway:ci ./backend
      - name: Build web image
        run: docker build -t wwf-web:ci ./web

  compose:
    name: Validate compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config >/dev/null && echo "compose config valid (project: wwf)"
