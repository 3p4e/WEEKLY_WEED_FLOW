name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend deps + import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Import app (route check)
        working-directory: backend
        # SECRET_KEY must be a real (non-placeholder) value here: app/config.py
        # refuses to start with the insecure default while ENVIRONMENT=production
        # (the default), same as it would for an actual deployment.
        env:
          SECRET_KEY: ci-only-dummy-secret-not-used-for-anything-real
        run: |
          python -c "import app.main as m; \
            paths=[getattr(r,'path','') for r in m.app.routes]; \
            print('routes:', len(paths)); \
            assert any(p.startswith('/audit') for p in paths), 'audit router not wired'; \
            assert any(p.startswith('/auth') for p in paths), 'auth router not wired'; \
            assert any(p.startswith('/reports') for p in paths), 'reports router not wired'"

  images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t wwf-backend:ci ./backend
      - name: Build web image
        run: docker build -t wwf-web:ci ./web

  compose:
    name: Validate compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config >/dev/null && echo "compose config valid (project: wwf)"
