name: Deploy WWF to KVM4

# Optional, MANUAL-ONLY deploy path. It rsyncs the repo to /opt/wwf and runs
# `docker compose up -d --build` against docker-compose.yml.
#
# ⚠️  Production on KVM4 is currently provisioned out-of-band (the live
#     containers were created directly, not by this compose). Running this
#     would converge /opt/wwf onto docker-compose.yml — recreating the live
#     db/backend/frontend containers. That is intentional only when you mean
#     it, so this workflow is dispatch-only (no auto-run on push) to avoid
#     surprising the live site on merge.
#
# Required repository secrets:
#   KVM4_HOST     -> 72.60.35.12 (or srv1231216.hstgr.cloud)
#   KVM4_USER     -> root
#   KVM4_SSH_KEY  -> a PRIVATE deploy key whose public half is in the VPS authorized_keys
#
# One-time on the server: create /opt/wwf/.env from .env.example (this workflow
# preserves it — it is excluded from the sync).

on:
  workflow_dispatch:

concurrency:
  group: deploy-kvm4
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KVM4_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.KVM4_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync repository to KVM4
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.venv' --exclude 'node_modules' \
            --exclude '.env' --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.KVM4_USER }}@${{ secrets.KVM4_HOST }}:/opt/wwf/"

      - name: Build & start the WWF stack
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.KVM4_USER }}@${{ secrets.KVM4_HOST }}" \
            'set -e; cd /opt/wwf; \
             test -f .env || { echo "::error::/opt/wwf/.env missing — create it from .env.example"; exit 1; }; \
             docker compose up -d --build; \
             docker compose ps'
