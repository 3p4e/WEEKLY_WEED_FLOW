version: '3.9'

# Development override configuration - extends docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - INSTALL_DEV=true
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - API_KEY=dev-key-change-in-production
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - ./output:/app/output
      - ./data:/app/data
      - ./sops_created:/app/sops_created
    restart: no
    command: >
      python -m uvicorn
      CONTENT_CREATOR_FRAMEWORK.main_api:app
      --host 0.0.0.0
      --port 8000
      --reload
    stdin_open: true
    tty: true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    volumes:
      - ./qms-ui-v2/src:/app/src
      - ./qms-ui-v2/public:/app/public
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - VITE_API_BASE=http://localhost:8000
    restart: no
    # Override command to run dev server
    command: npm run dev
    stdin_open: true
    tty: true

  postgres:
    environment:
      POSTGRES_DB: qms_dev
      POSTGRES_USER: qmsdev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: no

  # Optional: PgAdmin for database management in development
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - qms-network
    restart: no
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
    driver: local
