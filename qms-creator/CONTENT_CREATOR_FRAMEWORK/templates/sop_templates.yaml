# TEMPLATE SELECTION GUIDANCE
selection_rules:
  purpose:
    - Use "standard" for most SOPs
    - Use "risk_focused" when risk assessment is critical
    - Use "cannabis" for cannabis cultivation, processing, or QC SOPs

  scope:
    - Use "standard" for most SOPs
    - Use "environmental" when environmental controls are critical
    - Use "cultivation" for cannabis cultivation SOPs

  responsibilities:
    - Use "standard" for most SOPs
    - Use "matrix" for complex cross-functional procedures
    - Use "cannabis" for cannabis-specific operations

  procedure:
    - Use "standard" for general procedures
    - Use "cannabis_harvest" for harvest procedures
    - Use "qc_testing" for quality control test procedures

  documentation:
    - Use "standard" for most SOPs
    - Use "cannabis" for cannabis cultivation/QC SOPs

  training:
    - Use "standard" for general SOPs
    - Use "cannabis" for cannabis-specific roles

  references:
    - Use "standard" for most SOPs
    - Use "cannabis" for cannabis-specific SOPs

  definitions:
    - Use "standard" for most SOPs
    - Use "cannabis" for cannabis cultivation/QC SOPs

  annexes:
    - Use "standard" for most SOPs
    - Use "cannabis" for cannabis-specific SOPs
