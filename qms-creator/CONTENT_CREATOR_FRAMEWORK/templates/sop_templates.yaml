  # DEFINITIONS SECTION TEMPLATES
  definitions:
    # Standard Definitions
    standard: |
      ## 6. DEFINITIONS AND ABBREVIATIONS

      ### 6.1 Definitions
      {definitions_list}

      ### 6.2 Abbreviations
      {abbreviations_list}

    # Cannabis-Specific Definitions
    cannabis: |
      ## 6. DEFINITIONS AND ABBREVIATIONS

      ### 6.1 Cannabis-Specific Definitions

      - **Cannabinoid**: Naturally occurring organic compounds found in cannabis plants
      - **THC (Tetrahydrocannabinol)**: Primary psychoactive cannabinoid
      - **CBD (Cannabidiol)**: Non-psychoactive cannabinoid with therapeutic properties
      - **THCA/CBDA**: Non-decarboxylated precursors to THC/CBD
      - **Trichome**: Crystal-like structures containing cannabinoids and terpenes
      - **Cultivar**: Cannabis plant variety with specific genetic characteristics
      - **Phenotype**: Observable plant characteristics resulting from genetics + environment
      - **In-Process Control (IPC)**: Cannabinoid testing during cultivation/drying
      - **Release Testing**: Final cannabinoid verification before product approval

      ### 6.2 Abbreviations
      {abbreviations_list}

  # ANNEXES SECTION TEMPLATES
  annexes:
    # Standard Annexes List
    standard: |
      ## 9. ANNEXES

      The following annexes are referenced in this SOP:

      {annexes_list}

    # Cannabis-Specific Annexes
    cannabis: |
      ## 9. ANNEXES

      ### Referenced Annexes
      {annexes_list}

      ### Cannabis-Specific Supporting Documents
      - **Annex A**: Cannabis Cannabinoid Content Specification Chart
      - **Annex B**: HPLC/GC-MS Test Method for Cannabinoid Analysis
      - **Annex C**: Environmental Monitoring and Control Ranges
      - **Annex D**: Pest and Disease Identification Guide for Cannabis
      - **Annex E**: Cannabis Harvest Maturity Assessment Chart
      - **Annex F**: THC/CBD Compliance Decision Tree

