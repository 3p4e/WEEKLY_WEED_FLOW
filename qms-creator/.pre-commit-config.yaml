default_language_version:
  python: python3.12
  node: '22'

repos:
  # Python: Code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.12
        name: Black code formatter
        entry: black
        language: python
        types: [python]

  # Python: Linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Flake8 linter
        args: [--max-line-length=120, --ignore=E203,W503]
        types: [python]

  # Python: Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: MyPy type checker
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports, --warn-unused-ignores]
        types: [python]
        exclude: ^(tests|venv)/

  # Python: Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort import sorter
        args: [--profile=black]
        types: [python]

  # TypeScript/JavaScript: Linting
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: ESLint
        types: [javascript, typescript, jsx, tsx]
        files: \.(tsx?|jsx?)$
        additional_dependencies:
          - eslint
          - eslint-plugin-react
          - typescript
        args: [--max-warnings=0]

  # TypeScript/JavaScript: Code formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.1
    hooks:
      - id: prettier
        name: Prettier code formatter
        types_or: [javascript, typescript, jsx, tsx, json, markdown]
        additional_dependencies:
          - prettier
          - typescript

  # General: Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: [--baseline, .secrets.baseline]
        exclude: package.lock.json

  # General: YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        name: Check YAML
        args: [--unsafe]
      - id: check-json
        name: Check JSON
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=1000]
      - id: end-of-file-fixer
        name: Fix end of file
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: debug-statements
        name: Check for debug statements
      - id: mixed-line-ending
        name: Mixed line ending
        args: [--fix=lf]

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Hadolint Dockerfile linter

  # General: Markdown linting
  - repo: https://github.com/pre-commit/mirrors-markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        name: Markdown linter
        exclude: node_modules

  # Python: Docstring coverage
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: Pydocstyle
        types: [python]
        exclude: ^(tests|venv)/
        args: [--convention=google]

  # General: Git hooks
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest
        entry: bash -c 'cd CONTENT_CREATOR_FRAMEWORK && pytest tests/ -x'
        language: system
        pass_filenames: false
        stages: [commit]
        verbose: true

      - id: vitest-check
        name: vitest
        entry: bash -c 'cd qms-ui && npm run test'
        language: system
        pass_filenames: false
        stages: [commit]
        verbose: true
