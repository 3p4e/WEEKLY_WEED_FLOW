# Alembic Configuration
# This is the configuration file for Alembic, which is used for database migrations.

[alembic]
# path to migration scripts
script_location = CONTENT_CREATOR_FRAMEWORK/migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current working directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to zoneinfo.ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field when generating new migration files
# When set to 0 or False, unlimited length is used
# Using environment variable DATABASE_URL
# Set DATABASE_URL=postgresql://user:password@localhost/qms_creator
# or use default: postgresql://localhost/qms_creator
sqlalchemy.url = postgresql://localhost/qms_creator

# the output encoding used when revision files
# are written from script.py.mako
# string value is passed to the encoding parameter
# of the `file()` builtin
# Note: encoding is now handled by Python 3 defaults

# When set to true, revision id's are treated as ordered sequences
# rather then timestamps
# sqlalchemy.compare_type = false

# When set to true, the migration will attempt to render large tables
# and foreign keys as separate statements
# sqlalchemy.compare_server_default = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
