# Nginx config — serves the GrowFlow static front-end + proxies API and Letta
# calls to the QC_LIMS_Ao FastAPI backend on the same Docker network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index "GrowFlow Unified.html";

    # SPA-style: try file, fall back to the unified shell
    location / {
        try_files $uri $uri/ "/GrowFlow Unified.html";
    }

    # Long cache for static assets (immutable after build)
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Proxy all API calls to the FastAPI container (qc-lims-backend service)
    # Front-end calls `fetch('/api/v1/samples')` etc. — nginx strips /api/v1
    # and forwards to the backend's actual route prefixes.
    location /api/v1/ {
        proxy_pass http://qc-lims-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        client_max_body_size 50m;          # PDF uploads for CoA extraction
    }

    # Direct Letta gateway pass-through (the GrowFlow AI Gateway from backend/)
    location /ai-gateway/ {
        proxy_pass http://growflow-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Health endpoint
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
