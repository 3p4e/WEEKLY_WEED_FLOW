# GrowFlow full stack on KVM4 — alongside the QC_LIMS_Ao FastAPI backend,
# the Letta AI gateway, and the Letta server.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Reachable at:
#   http://<host>/                 → GrowFlow front-end (unified app)
#   http://<host>/api/v1/...       → QC_LIMS_Ao FastAPI (proxied by nginx)
#   http://<host>/ai-gateway/...   → GrowFlow Letta gateway (proxied)

services:
  growflow-frontend:
    build:
      context: ..                  # repo root has the HTML + gf/ + qc/ + app/
      dockerfile: deploy/Dockerfile
    container_name: growflow-frontend
    ports:
      - "80:80"
    depends_on:
      - qc-lims-backend
      - growflow-gateway
    restart: unless-stopped
    networks: [growflow]

  qc-lims-backend:
    image: qc-lims-ao:latest        # build from QC_LIMS_Ao/backend/Dockerfile
    container_name: qc-lims-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://qclims:qclims@postgres:5432/qclims
      - CORS_ORIGINS=http://localhost,http://growflow-frontend
      - LETTA_BASE_URL=http://letta:8283
    depends_on:
      - postgres
      - letta
    restart: unless-stopped
    networks: [growflow]

  growflow-gateway:
    image: growflow-gateway:latest  # build from backend/Dockerfile
    container_name: growflow-gateway
    environment:
      - LETTA_BASE_URL=http://letta:8283
      - LETTA_MODEL=${LETTA_MODEL:-openai/gpt-4o-mini}
      - LETTA_EMBEDDING=${LETTA_EMBEDDING:-openai/text-embedding-3-small}
      - GROWFLOW_ALLOWED_ORIGINS=http://localhost,http://growflow-frontend
    depends_on:
      - letta
    restart: unless-stopped
    networks: [growflow]

  letta:
    image: letta/letta:latest
    container_name: letta
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - letta_data:/root/.letta
    restart: unless-stopped
    networks: [growflow]

  postgres:
    image: postgres:16-alpine
    container_name: qc-lims-postgres
    environment:
      - POSTGRES_USER=qclims
      - POSTGRES_PASSWORD=qclims
      - POSTGRES_DB=qclims
    volumes:
      - qclims_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [growflow]

networks:
  growflow:
    driver: bridge

volumes:
  letta_data:
  qclims_data:
