# GrowFlow Unified (project: QC_LIMS_Ao1) — end-to-end stack:
# Postgres + FastAPI API + nginx (React SPA)
#
#   docker compose up --build      → http://localhost:8080  (the app)
#                                     http://localhost:8000/docs  (API docs)
#
# The backend seeds the database on startup (idempotent), then serves the API.
# nginx serves the built React app and reverse-proxies API calls to the backend,
# so the browser talks to a single origin.
#
# Dependency wiring on the KVM4 host:
#   * The app's OWN data lives in the bundled `db` service (database qc_lims).
#   * The AI services (Letta + Qdrant + Letta-MCP) run as SEPARATE containers on
#     the host and publish their ports.  The backend reaches them via
#     host.docker.internal by default (works regardless of network); deploy/
#     kvm4.sh additionally attaches the backend to each dependency's Docker
#     network so container-name routing is available too.
#   * `kpm_shared` is a named bridge shared with KPM runner containers (e.g.
#     kvm4-runner); deploy/kvm4.sh connects them after the stack is up.

name: QC_LIMS_Ao1

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qc_lims
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qc_lims"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/qc_lims
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost","http://localhost:5173","http://72.60.35.12:8080","http://72.60.35.12"]'
      DEBUG: "false"
      # AI dependencies — reachable on the host via the docker host-gateway.
      # Override in .env to point elsewhere (e.g. container-name URLs).
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      LETTA_BASE_URL: ${LETTA_BASE_URL:-http://host.docker.internal:8283}
      LETTA_MCP_URL: ${LETTA_MCP_URL:-http://host.docker.internal:6507}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    extra_hosts:
      # Lets the backend resolve host-published ports (Letta/Qdrant) from inside
      # the container. Docker Engine 20.10+ maps this to the host gateway.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    # Seed (idempotent) then launch the API.
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - internal
      - kpm_shared

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
  kpm_shared:
    driver: bridge
    # Compose creates/uses this network; the deploy script then connects any
    # KPM runner containers already up on the host (e.g. kvm4-runner).
    name: ${KPM_NETWORK:-kpm_network}

volumes:
  pgdata:
