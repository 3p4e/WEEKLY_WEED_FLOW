# nginx for WEEKLY_WEED_FLOW SPA — serves the build and reverse-proxies the API
# path-prefixes to the backend so the browser stays same-origin.
upstream wwf_api { server weekly_weed_flow-backend-1:8000; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(auth|tasks|weeks|departments|ai|health|docs|redoc|openapi\.json) {
        proxy_pass http://wwf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
