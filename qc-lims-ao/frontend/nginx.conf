# nginx for the GrowFlow Unified SPA. Serves the static build and reverse-proxies
# API calls to the FastAPI backend so the browser stays same-origin.

upstream api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + docs → FastAPI backend.
    location ~ ^/(auth|samples|specifications|coa|oos|audit|sampling-requests|transport|capa|water|stability|health|ai|docs|redoc|openapi\.json) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
