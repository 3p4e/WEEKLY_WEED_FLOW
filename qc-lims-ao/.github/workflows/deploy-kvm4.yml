name: Deploy to KVM4

# Runs on GitHub's hosted runners (which CAN reach the server over SSH) and
# deploys GrowFlow Unified to the KVM4 host. Triggered manually, or on pushes to
# main that touch the app/deploy files. The runner SSHes in and runs the same
# deploy/kvm4.sh one-shot script (docker compose up -d --build).
#
# One-time setup — add these repository secrets (Settings → Secrets and
# variables → Actions):
#   KVM4_HOST      72.60.35.12
#   KVM4_USERNAME  root
#   KVM4_SSH_KEY   <the PRIVATE SSH key whose public half is in the server's authorized_keys>
#   KVM4_PORT      22            (optional; defaults to 22)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - '.github/workflows/deploy-kvm4.yml'

concurrency:
  group: deploy-kvm4
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.KVM4_HOST }}
          username: ${{ secrets.KVM4_USERNAME }}
          key: ${{ secrets.KVM4_SSH_KEY }}
          port: ${{ secrets.KVM4_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            curl -fsSL https://raw.githubusercontent.com/3p4e/QC_LIMS_Ao/main/deploy/kvm4.sh | bash
