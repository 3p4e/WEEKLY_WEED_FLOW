# GrowFlow Unified — converged stack (project: growflow_unified).
# Supersedes the weekly_weed_flow prototype at ${APP_HOST}. The web (nginx) is the
# only service exposed via the shared Traefik proxy; it reverse-proxies the API
# path-prefixes same-origin to planner-api. db is internal with a named volume.
#
# Secrets come from stack.env (generated server-side, never committed):
#   POSTGRES_PASSWORD, GROWFLOW_APP_PASSWORD, PLANNER_JWT_SECRET
name: growflow_unified

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: growflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d growflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  planner-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # entrypoint (psql migrations + role password)
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: growflow
      GROWFLOW_APP_PASSWORD: ${GROWFLOW_APP_PASSWORD:?}
      # app config (PLANNER_*)
      PLANNER_DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/growflow"
      PLANNER_APP_DATABASE_URL: "postgresql+psycopg://growflow_app:${GROWFLOW_APP_PASSWORD}@db:5432/growflow"
      PLANNER_JWT_SECRET: ${PLANNER_JWT_SECRET:?}
      PLANNER_BIND_HOST: "0.0.0.0"
      PLANNER_CORS_ORIGINS: '["https://${APP_HOST:-wwf.srv1231216.hstgr.cloud}"]'
      PLANNER_LETTA_BASE_URL: ${LETTA_BASE_URL:-http://host.docker.internal:8283}
      # Weekly snapshot → Letta source (degrades gracefully when any is unset).
      PLANNER_LETTA_API_KEY: ${LETTA_SERVER_PASS:-}
      PLANNER_LETTA_SNAPSHOT_SOURCE_ID: ${LETTA_SNAPSHOT_SOURCE_ID:-}
      PLANNER_ENABLE_WEEKLY_SCHEDULER: ${ENABLE_WEEKLY_SCHEDULER:-0}
      PLANNER_ENVIRONMENT: prod
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"     # reach host-published Letta
    restart: unless-stopped
    networks: [internal, shared]

  web:
    build: ./web
    depends_on: [planner-api]
    restart: unless-stopped
    networks: [internal, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_network"
      traefik.http.routers.wwf.entrypoints: "websecure"
      traefik.http.routers.wwf.rule: "Host(`${APP_HOST:-wwf.srv1231216.hstgr.cloud}`)"
      traefik.http.routers.wwf.tls.certresolver: "letsencrypt"
      traefik.http.services.wwf.loadbalancer.server.port: "80"

networks:
  internal:
  shared:   { external: true }                  # Letta/shared net (graceful if absent)
  traefik:  { external: true, name: traefik_network }

volumes:
  pgdata:
    name: growflow_unified_pgdata
