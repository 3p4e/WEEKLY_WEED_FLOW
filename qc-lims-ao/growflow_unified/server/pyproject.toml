[project]
name = "planner-api"
version = "0.1.0"
description = "Standalone weekly production planner API (FastAPI): tasks, weekly reports, executive analytics."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "alembic>=1.13",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
planner-api = "planner_api.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["planner_api*"]

[tool.ruff]
line-length = 100
