# Serve the SPA and reverse-proxy the API (same origin -> no CORS needed in the browser).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API surface -> planner_api service.
    location ~ ^/(auth|planner|governance|ai|health|docs|redoc|openapi\.json) {
        proxy_pass http://planner-api:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
