<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASS WEED — Reports</title>
<link rel="stylesheet" href="mass-weed.css">
<style>
  html,body{margin:0;background:var(--mw-void);}
  .wrap{ max-width:1180px; margin:0 auto; padding:20px 24px 60px; }
  .layout{ display:grid; grid-template-columns:300px 1fr; gap:18px; align-items:start; }
  .cfg{ display:flex; flex-direction:column; gap:16px; }
  .cfg__sec h4{ font-family:var(--mw-font); font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--mw-text-dim); margin:0 0 9px; }

  .opt{ display:flex; align-items:center; gap:9px; padding:7px 0; cursor:pointer; font-size:13px; color:var(--mw-text); }
  .box{ width:18px; height:18px; flex:none; box-shadow:inset 0 0 0 1.5px rgba(94,200,240,.4); clip-path:polygon(3px 0,100% 0,100% 100%,0 100%,0 3px);
    display:flex; align-items:center; justify-content:center; transition:background .12s; }
  .opt.on .box{ background:var(--mw-cyan); box-shadow:none; } .box svg{ width:11px; height:11px; fill:var(--mw-void); opacity:0; } .opt.on .box svg{ opacity:1; }
  .radio{ border-radius:50%; }
  .seg{ display:flex; gap:0; }
  .seg button{ flex:1; padding:8px 0; font-size:12px; font-family:var(--mw-font); color:var(--mw-text-dim); background:rgba(6,20,40,.5);
    box-shadow:inset 0 0 0 1px rgba(94,200,240,.14); border:none; cursor:pointer; transition:all .12s; }
  .seg button.on{ background:rgba(58,159,212,.2); color:var(--mw-cyan-bright); box-shadow:inset 0 0 0 1px var(--mw-cyan); }

  /* preview report sheet */
  .sheet{ background:linear-gradient(180deg,rgba(9,26,46,.9),rgba(6,18,34,.9)); box-shadow:inset 0 0 0 1px rgba(94,200,240,.18), 0 0 40px rgba(0,0,0,.4);
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); padding:30px 34px; min-height:600px; }
  .sheet__hd{ display:flex; align-items:flex-start; justify-content:space-between; border-bottom:1px solid rgba(94,200,240,.2); padding-bottom:16px; margin-bottom:20px; }
  .sheet__title{ font-family:var(--mw-font-cond); font-size:26px; font-weight:700; color:var(--mw-ink); letter-spacing:.02em; }
  .sheet__sub{ font-size:12px; color:var(--mw-text-dim); margin-top:4px; letter-spacing:.04em; }
  .sheet__brand{ text-align:right; } .sheet__brand .b{ font-family:var(--mw-font-cond); font-weight:700; letter-spacing:.14em; color:var(--mw-cyan-bright); font-size:15px; }
  .sheet__brand .d{ font-size:10px; color:var(--mw-text-faint); letter-spacing:.08em; margin-top:2px; }

  .kpirow{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .kpi{ background:rgba(6,20,40,.5); box-shadow:inset 0 0 0 1px rgba(94,200,240,.12); padding:12px 14px; clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px); }
  .kpi .l{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--mw-text-dim); }
  .kpi .v{ font-family:var(--mw-font-cond); font-size:22px; font-weight:700; color:var(--mw-ink); margin-top:3px; }
  .kpi .d{ font-size:11px; margin-top:2px; } .kpi .d.up{ color:var(--mw-stat-hi); } .kpi .d.dn{ color:var(--mw-stat-lo); }

  .sec{ margin-bottom:22px; } .sec.hide{ display:none; }
  .sec__t{ font-family:var(--mw-font); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--mw-cyan-bright); margin-bottom:10px; }
  .bars{ display:flex; align-items:flex-end; gap:14px; height:130px; padding:0 4px; }
  .bar{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar__col{ width:100%; background:linear-gradient(180deg,var(--mw-cyan),rgba(16,48,80,.6)); clip-path:polygon(3px 0,100% 0,100% 100%,0 100%,0 3px); }
  .bar__lbl{ font-size:10px; color:var(--mw-text-dim); }
  .ph{ font-size:20px; color:var(--mw-text-faint); }
  .fmtbtns{ display:flex; gap:10px; margin-top:16px; }
</style>
</head>
<body>
<div class="mw-root">
<div class="wrap" data-screen-label="Reports">
  <nav class="mw-nav">
    <span class="mw-nav__mark"></span><span class="mw-nav__brand">Mass Weed</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="analytics.html">Analytics</a>
    <a href="reports.html" class="is-active">Reports</a>
    <a href="board.html">Cycle Board</a>
    <a href="login.html" style="margin-left:auto;">Sign Out</a>
  </nav>

  <div class="mw-header-bar"><span class="mw-rule"></span><h1 class="mw-title mw-title--xl">Report Builder</h1><span class="mw-rule"></span></div>

  <div class="layout">
    <!-- config -->
    <div class="mw-panel cfg">
      <div class="cfg__sec">
        <h4>Report Type</h4>
        <div id="types"></div>
      </div>
      <div class="cfg__sec">
        <h4>Date Range</h4>
        <div class="seg" id="range">
          <button data-r="7d">7D</button><button data-r="30d" class="on">30D</button><button data-r="qtr">QTR</button><button data-r="ytd">YTD</button>
        </div>
      </div>
      <div class="cfg__sec">
        <h4>Include Sections</h4>
        <div id="sections"></div>
      </div>
      <div class="cfg__sec">
        <h4>Export Format</h4>
        <div class="fmtbtns">
          <button class="mw-btn mw-btn--primary" style="flex:1;" onclick="exportReport('PDF')">↧ PDF</button>
          <button class="mw-btn" style="flex:1;" onclick="exportReport('CSV')">↧ CSV</button>
        </div>
        <button class="mw-btn mw-btn--wide" style="margin-top:10px;" onclick="exportReport('scheduled')">◷ Schedule Recurring</button>
      </div>
    </div>

    <!-- preview -->
    <div>
      <div class="sheet" id="sheet"></div>
    </div>
  </div>
</div>
</div>

<script src="nav.js"></script>
<script src="cmdk.js"></script>
<script>
  const CHK='<svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19.2 20 8.2l-1.4-1.4z"/></svg>';
  const TYPES=[
    {id:'prod',name:'Production Summary',sub:'Yield, cycle times, harvest output'},
    {id:'compliance',name:'Compliance Report',sub:'METRC reconciliation & audit trail'},
    {id:'crew',name:'Crew Performance',sub:'Task throughput & efficiency'},
    {id:'inventory',name:'Inventory Valuation',sub:'Stock levels & value by category'},
  ];
  const SECTIONS=[['kpi','Key Metrics',true],['chart','Trend Charts',true],['table','Detail Tables',true],['notes','Analyst Notes',false]];
  let TYPE='prod', RANGE='30d';
  const secOn={kpi:true,chart:true,table:true,notes:false};

  const RANGE_LBL={'7d':'Last 7 days','30d':'Last 30 days','qtr':'This quarter','ytd':'Year to date'};
  const REPORTS={
    prod:{kpis:[['Total Yield','486 kg','▲ 8.4%','up'],['Avg Cycle','63 days','▼ 2 days','up'],['Harvests','12','▲ 3','up'],['g / watt','1.42','▲ 0.08','up']],
      bars:[['Wk1',60],['Wk2',72],['Wk3',68],['Wk4',88]], barlbl:'Weekly Yield (kg)'},
    compliance:{kpis:[['Reconciled','100%','0 variance','up'],['Tags Tracked','3,214','▲ 210','up'],['Deviations','2','▼ 1','up'],['Audit Score','A','stable','']],
      bars:[['Wk1',98],['Wk2',100],['Wk3',99],['Wk4',100]], barlbl:'Daily Reconcile Rate (%)'},
    crew:{kpis:[['Tasks Done','842','▲ 12%','up'],['Avg Eff','91%','▲ 3%','up'],['On-Time','96%','▲ 2%','up'],['Overdue','7','▼ 4','up']],
      bars:[['Cult',88],['Ext',76],['QA',94],['Pack',82]], barlbl:'Efficiency by Team (%)'},
    inventory:{kpis:[['Total Value','$1.24M','▲ 5.1%','up'],['SKUs','142','▲ 6','up'],['Low Stock','9','▲ 2','dn'],['Turnover','4.2×','▲ 0.3','up']],
      bars:[['Flower',62],['Pre-roll',28],['Extract',44],['Edible',18]], barlbl:'Value by Category ($K)'},
  };

  function drawTypes(){
    document.getElementById('types').innerHTML=TYPES.map(t=>
      `<div class="opt ${t.id===TYPE?'on':''}" onclick="TYPE='${t.id}';drawTypes();render()">
        <div class="box radio">${CHK}</div><div><div>${t.name}</div><div style="font-size:11px;color:var(--mw-text-dim);">${t.sub}</div></div></div>`).join('');
  }
  function drawSections(){
    document.getElementById('sections').innerHTML=SECTIONS.map(([k,lbl])=>
      `<div class="opt ${secOn[k]?'on':''}" onclick="secOn['${k}']=!secOn['${k}'];drawSections();render()">
        <div class="box">${CHK}</div><div>${lbl}</div></div>`).join('');
  }
  document.getElementById('range').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#range button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    RANGE=b.dataset.r; render();
  });

  function render(){
    const t=TYPES.find(x=>x.id===TYPE), r=REPORTS[TYPE];
    const maxB=Math.max(...r.bars.map(b=>b[1]));
    document.getElementById('sheet').innerHTML=`
      <div class="sheet__hd">
        <div><div class="sheet__title">${t.name}</div><div class="sheet__sub">${RANGE_LBL[RANGE]} · Generated ${new Date().toLocaleDateString()}</div></div>
        <div class="sheet__brand"><div class="b">MASS WEED</div><div class="d">Systems Alliance Cultivation</div></div>
      </div>
      ${secOn.kpi?`<div class="sec"><div class="sec__t">Key Metrics</div><div class="kpirow">
        ${r.kpis.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d ${k[3]}">${k[2]}</div></div>`).join('')}
      </div></div>`:''}
      ${secOn.chart?`<div class="sec"><div class="sec__t">${r.barlbl}</div><div class="bars">
        ${r.bars.map(b=>`<div class="bar"><div class="bar__col" style="height:${b[1]/maxB*110}px"></div><div class="bar__lbl">${b[0]}</div></div>`).join('')}
      </div></div>`:''}
      ${secOn.table?`<div class="sec"><div class="sec__t">Detail Breakdown</div>
        <table class="mw-table"><thead><tr><th>Metric</th><th>Current</th><th>Prior</th><th>Δ</th></tr></thead><tbody>
        ${r.kpis.map(k=>`<tr><td>${k[0]}</td><td class="mono">${k[1]}</td><td>—</td><td style="color:${k[3]==='up'?'var(--mw-stat-hi)':k[3]==='dn'?'var(--mw-stat-lo)':'var(--mw-text-dim)'}">${k[2]}</td></tr>`).join('')}
        </tbody></table></div>`:''}
      ${secOn.notes?`<div class="sec"><div class="sec__t">Analyst Notes</div>
        <div style="font-size:13px;color:var(--mw-text);line-height:1.6;background:rgba(6,20,40,.4);padding:14px 16px;clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px);">
        Output tracking above target for the period. Recommend maintaining current environmental setpoints in Flower A and scheduling preventive IPM in Zone 4. No compliance deviations outstanding.</div></div>`:''}
    `;
  }

  function exportReport(fmt){
    const t=TYPES.find(x=>x.id===TYPE);
    if(fmt==='scheduled'){ toast('Recurring '+t.name+' scheduled — emailed weekly'); return; }
    toast('Exporting “'+t.name+'” as '+fmt+' · '+RANGE_LBL[RANGE]);
  }
  function toast(msg){
    let el=document.getElementById('toast');
    if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el);
      el.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(6,20,40,.96);color:var(--mw-cyan-bright);'+
      'font-size:13px;padding:12px 20px;box-shadow:inset 0 0 0 1px var(--mw-cyan),0 0 24px rgba(58,159,212,.3);'+
      'clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);z-index:60;transition:opacity .2s;font-family:var(--mw-font);letter-spacing:.03em;'; }
    el.textContent='✓ '+msg; el.style.opacity='1';
    clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity='0',2600);
  }
  drawTypes(); drawSections(); render();
</script>
</body>
</html>
