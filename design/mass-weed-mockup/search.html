<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASS WEED — Search</title>
<link rel="stylesheet" href="mass-weed.css">
<style>
  html,body{margin:0;background:var(--mw-void);}
  .wrap{ max-width:1080px; margin:0 auto; padding:20px 24px 60px; }
  .bigsearch{ display:flex; align-items:center; gap:13px; background:rgba(6,20,40,.6); box-shadow:inset 0 0 0 1px rgba(94,200,240,.22); padding:15px 18px;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px); margin-bottom:16px; }
  .bigsearch input{ flex:1; background:none; border:none; outline:none; color:var(--mw-ink); font-family:var(--mw-font); font-size:18px; }
  .bigsearch svg{ width:22px; height:22px; fill:var(--mw-cyan-bright); }
  .meta{ font-size:12px; color:var(--mw-text-dim); margin-bottom:16px; }
  .meta b{ color:var(--mw-cyan-bright); }

  .filters{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .filt{ font-size:12px; padding:6px 13px; color:var(--mw-text); cursor:pointer; clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px);
    background:rgba(6,20,40,.5); box-shadow:inset 0 0 0 1px rgba(94,200,240,.14); transition:all .12s ease; }
  .filt:hover{ box-shadow:inset 0 0 0 1px var(--mw-cyan); }
  .filt.on{ background:rgba(58,159,212,.2); color:var(--mw-cyan-bright); box-shadow:inset 0 0 0 1px var(--mw-cyan); }
  .filt .c{ font-family:var(--mw-font-cond); color:var(--mw-text-faint); margin-left:5px; }
  .filt.on .c{ color:var(--mw-cyan); }

  .group{ margin-bottom:24px; }
  .group__hd{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .group__hd h3{ font-family:var(--mw-font); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--mw-text-dim); margin:0; }
  .group__rule{ flex:1; height:1px; background:linear-gradient(90deg,rgba(94,200,240,.25),transparent); }
  .res{ display:flex; align-items:center; gap:14px; padding:12px 15px; cursor:pointer; transition:box-shadow .12s ease,transform .1s ease; margin-bottom:7px; }
  .res:hover{ box-shadow:inset 0 0 0 1.5px var(--mw-cyan), 0 0 18px rgba(58,159,212,.15); transform:translateX(2px); }
  .res__ic{ flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; background:rgba(58,159,212,.14);
    clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px); }
  .res__ic svg{ width:17px; height:17px; fill:var(--mw-cyan-bright); }
  .res__main{ flex:1; min-width:0; }
  .res__t{ font-size:14px; color:var(--mw-ink); font-weight:600; }
  .res__t em{ color:var(--mw-cyan-bright); font-style:normal; background:rgba(58,159,212,.16); padding:0 2px; }
  .res__sub{ font-size:11.5px; color:var(--mw-text-dim); margin-top:2px; }
  .res__type{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--mw-text-faint); }
  .empty{ text-align:center; color:var(--mw-text-faint); padding:50px 0; }
  .empty svg{ width:40px; height:40px; fill:var(--mw-text-faint); opacity:.4; margin-bottom:12px; }
</style>
</head>
<body>
<div class="mw-root">
<div class="wrap" data-screen-label="Search Results">
  <nav class="mw-nav">
    <span class="mw-nav__mark"></span><span class="mw-nav__brand">Mass Weed</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="my-day.html">My Day</a>
    <a href="board.html">Cycle Board</a>
    <a href="inventory.html">Inventory</a>
    <a href="login.html" style="margin-left:auto;">Sign Out</a>
  </nav>

  <div class="bigsearch">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
    <input id="q" placeholder="Search tasks, batches, crew, SOPs, orders…" oninput="render()" autofocus>
  </div>
  <div class="meta" id="meta"></div>
  <div class="filters" id="filters"></div>
  <div id="results"></div>
</div>
</div>

<script src="nav.js"></script>
<script src="cmdk.js"></script>
<script>
  const IC={
    task:'<svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19.2 20 8.2l-1.4-1.4z"/></svg>',
    batch:'<svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.2L18.9 8 12 11.8 5.1 8 12 4.2z"/></svg>',
    crew:'<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 10-5-5 5 5 0 005 5zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"/></svg>',
    sop:'<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5z"/></svg>',
    order:'<svg viewBox="0 0 24 24"><path d="M7 4h13l-1.5 9H8.5L7 4zm0 0L6 2H2m5 18a1.5 1.5 0 103 0 1.5 1.5 0 00-3 0zm9 0a1.5 1.5 0 103 0 1.5 1.5 0 00-3 0z"/></svg>',
    zone:'<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1114.5 9 2.5 2.5 0 0112 11.5z"/></svg>',
  };
  const DATA=[
    {t:'Sign COA F-24 batch',sub:'Task · Due today · A. Shepard',type:'task',href:'task-detail.html'},
    {t:'Flower A ballast swap',sub:'Task · In progress · Facilities',type:'task',href:'my-day.html'},
    {t:'Zone 4 mildew inspection',sub:'Task · High priority · G. Vakarian',type:'task',href:'my-day.html'},
    {t:'METRC daily reconcile',sub:'Task · Recurring · L. T\u2019Soni',type:'task',href:'my-day.html'},
    {t:'Batch F-24 · Gorilla Glue #4',sub:'Batch · Flower · Day 48 · Room A',type:'batch',href:'board.html'},
    {t:'Batch F-23 · Blue Dream',sub:'Batch · Curing · Room C',type:'batch',href:'board.html'},
    {t:'Batch V-11 · Wedding Cake',sub:'Batch · Veg · Room B',type:'batch',href:'board.html'},
    {t:'A. Shepard',sub:'Crew · Master Grower · 96% eff',type:'crew',href:'team.html'},
    {t:'G. Vakarian',sub:'Crew · IPM Lead · Flower A',type:'crew',href:'team.html'},
    {t:'T. Krios',sub:'Crew · Extraction Tech',type:'crew',href:'workload.html'},
    {t:'Flower Room Daily Walk',sub:'SOP · Cultivation · 5 steps',type:'sop',href:'sop.html'},
    {t:'Live Resin Run',sub:'SOP · Extraction · 6 steps',type:'sop',href:'sop.html'},
    {t:'COA Review & Release',sub:'SOP · Quality · 5 steps',type:'sop',href:'sop.html'},
    {t:'Solvent Spill Response',sub:'SOP · Safety · 5 steps',type:'sop',href:'sop.html'},
    {t:'Order #MW-3182',sub:'Order · Nova Dispensary · Packing',type:'order',href:'orders.html'},
    {t:'Order #MW-3179',sub:'Order · Element Retail · In transit',type:'order',href:'orders.html'},
    {t:'Flower Room A',sub:'Zone · 48 plants · 24.1°C / 55% RH',type:'zone',href:'dashboard.html'},
    {t:'Extraction Lab',sub:'Zone · Live resin run active',type:'zone',href:'dashboard.html'},
  ];
  const TYPES=[['all','All'],['task','Tasks'],['batch','Batches'],['crew','Crew'],['sop','SOPs'],['order','Orders'],['zone','Zones']];
  let FILT='all';

  // seed query from ?q= or cmdk
  const params=new URLSearchParams(location.search);
  if(params.get('q')) document.getElementById('q').value=params.get('q');

  function hl(text,q){ if(!q) return text; const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return text;
    return text.slice(0,i)+'<em>'+text.slice(i,i+q.length)+'</em>'+text.slice(i+q.length); }
  function match(d,q){ return !q || d.t.toLowerCase().includes(q) || d.sub.toLowerCase().includes(q); }

  function render(){
    const q=(document.getElementById('q').value||'').trim().toLowerCase();
    let rows=DATA.filter(d=>match(d,q));
    // filter counts
    const counts={all:rows.length};
    TYPES.slice(1).forEach(([k])=>counts[k]=rows.filter(d=>d.type===k).length);
    document.getElementById('filters').innerHTML=TYPES.map(([k,lbl])=>
      `<div class="filt ${k===FILT?'on':''}" onclick="FILT='${k}';render()">${lbl}<span class="c">${counts[k]||0}</span></div>`).join('');
    if(FILT!=='all') rows=rows.filter(d=>d.type===FILT);
    document.getElementById('meta').innerHTML= q? `<b>${rows.length}</b> result${rows.length!==1?'s':''} for “${q}”` : `Showing <b>${rows.length}</b> records across the facility`;

    if(!rows.length){ document.getElementById('results').innerHTML=
      `<div class="empty"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg><div>No records match your search.</div></div>`; return; }

    // group by type
    const groups={};
    rows.forEach(d=>{ (groups[d.type]=groups[d.type]||[]).push(d); });
    const label=Object.fromEntries(TYPES);
    document.getElementById('results').innerHTML=Object.keys(groups).map(type=>`
      <div class="group"><div class="group__hd"><h3>${label[type]||type}</h3><div class="group__rule"></div></div>
        ${groups[type].map(d=>`
          <div class="mw-panel--alt res" onclick="location.href='${d.href}'">
            <div class="res__ic">${IC[d.type]||''}</div>
            <div class="res__main"><div class="res__t">${hl(d.t,q)}</div><div class="res__sub">${hl(d.sub,q)}</div></div>
            <div class="res__type">↵ open</div>
          </div>`).join('')}
      </div>`).join('');
  }
  render();
</script>
</body>
</html>
