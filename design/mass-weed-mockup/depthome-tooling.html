<!--
  ════════════════════════════════════════════════════════════════════
  DESIGN NOTES · Department Home  (surface 3.1, brief §3.1)  — .dh-* scope
  ────────────────────────────────────────────────────────────────────
  WHAT THIS IS: the week-scoped landing an operator/manager sees first,
  branded to their department. One file demonstrates all 7 department
  templates (switchable via the dept picker) + the generic fallback +
  the empty-week state.

  EXTENDED FROM THE SYSTEM (added to mass-weed.css as shared atoms):
    .mw-tcard (compact task card), .mw-attr (filled mono attribute chip),
    .mw-htag (#hash outline chip), .mw-due(+--over), .mw-sub, .mw-st--*
    (status pills: done/working/review/stuck/postponed). Dept identity is
    carried by --mw-acc (set inline) — reuses the existing domain-tint
    pattern (--mw-screen-acc / --mw-col-acc), so a card, panel edge, chip
    and preset all glow in the department color with ONE variable.

  NEW TOKENS PROPOSED: none required — dept color is passed inline as
    --mw-acc. (If folded into the app, add --dept-cu … --dept-mu to the
    token layer mirroring the 7 brief hexes.)

  BILINGUAL: every label carries <span class="en"> + <span class="mk">;
    html[data-lang] toggles. Cyrillic strings run ~25% longer — panels
    and chips wrap, never truncate (min-width:0 on grid children).

  STATES COVERED: hover (card lift, preset glow), active (dept picker),
    empty (friendly bilingual state + presets as the CTA), and the
    per-template layouts (by-room / by-batch / due+review / in-out /
    CAPA+queue / patrols+incidents / by-equipment+blocked / generic).
    Dark + light both via data-theme.
  ════════════════════════════════════════════════════════════════════
-->
<style>
  html,body{ margin:0; background:var(--mw-void); }
  .wrap{ max-width:1200px; margin:0 auto; padding:18px 24px 70px; }

  /* top bar: brand-ish title left, controls right */
  .dh-top{ display:flex; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .dh-top__ttl{ font-family:var(--mw-font-cond); text-transform:uppercase; letter-spacing:.16em; font-size:13px; color:var(--mw-text-dim); }
  .dh-top__sp{ flex:1; }

  .dh-picker{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; margin-bottom:16px; scrollbar-width:thin; }

    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);

  .dh-pick__dot{ width:9px; height:9px; border-radius:50%; background:var(--dc); box-shadow:0 0 7px var(--dc); flex:none; }
  .dh-pick:hover{ color:var(--mw-cyan-bright); }
  .dh-pick.is-active{ color:var(--mw-ink); background:color-mix(in srgb, var(--dc) 20%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 55%, transparent); }

  /* dept hero header (tinted wash) */
  .dh-hero{ display:flex; align-items:center; gap:16px; padding:18px 22px; margin-bottom:16px;
    background:linear-gradient(120deg, color-mix(in srgb, var(--mw-acc) 22%, transparent) 0%, var(--mw-panel) 55%);
    clip-path:polygon(var(--mw-chamfer) 0,100% 0,100% calc(100% - var(--mw-chamfer)),calc(100% - var(--mw-chamfer)) 100%,0 100%,0 var(--mw-chamfer));
    box-shadow:var(--mw-inner-glow); position:relative; }
  .dh-hero::before{ content:""; position:absolute; inset:0; clip-path:inherit; padding:1.5px;
    background:linear-gradient(150deg, var(--mw-acc), transparent 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
  .dh-hero__ic{ width:52px; height:52px; flex:none; display:grid; place-items:center; color:var(--mw-acc);
    background:color-mix(in srgb, var(--mw-acc) 14%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mw-acc) 45%, transparent);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
  .dh-hero__ic svg{ width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .dh-hero__name{ font-family:var(--mw-font-cond); font-size:26px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mw-ink); text-shadow:0 0 18px color-mix(in srgb,var(--mw-acc) 40%, transparent); line-height:1; }
  .dh-hero__sub{ font-size:12px; color:var(--mw-text-dim); margin-top:5px; letter-spacing:.04em; }
  .dh-hero__stat{ margin-left:auto; text-align:right; }
  .dh-hero__num{ font-family:var(--mw-font-cond); font-size:34px; font-weight:700; color:var(--mw-acc); line-height:1; text-shadow:0 0 16px color-mix(in srgb,var(--mw-acc) 45%, transparent); }
  .dh-hero__numl{ font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--mw-text-dim); margin-top:4px; }

  .dh-week{ display:flex; align-items:center; gap:14px; padding:10px 16px; margin-bottom:16px;

  .dh-week__nav{ width:30px; height:30px; display:grid; place-items:center; cursor:pointer; color:var(--mw-cyan); background:rgba(58,159,212,.12); clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px); }
  .dh-week__nav:hover{ color:var(--mw-cyan-bright); background:rgba(58,159,212,.22); }
  .dh-week__nav svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; }
  .dh-week__lbl{ font-family:var(--mw-font-cond); font-size:18px; font-weight:700; letter-spacing:.05em; color:var(--mw-ink); }
  .dh-week__range{ font-family:'Saira Condensed',monospace; font-size:13px; color:var(--mw-text-dim); }
  .dh-week__sp{ flex:1; }

  /* preset chips */
  .dh-presets{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:20px; }
  .dh-preset{ display:inline-flex; align-items:center; gap:8px; padding:9px 14px; cursor:pointer;
    font-family:var(--mw-font); font-size:13px; font-weight:600; color:var(--mw-text);
    background:color-mix(in srgb, var(--mw-acc) 10%, var(--mw-panel-in));
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mw-acc) 30%, transparent);
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px); transition:all .13s ease; }
  .dh-preset .plus{ color:var(--mw-acc); font-weight:700; font-size:15px; line-height:1; }
  .dh-preset:hover{ color:var(--mw-ink); background:color-mix(in srgb, var(--mw-acc) 22%, transparent);

  /* layout grids */
  .dh-grid{ display:grid; gap:14px; }
  .dh-grid.g-groups{ grid-template-columns:1fr 1fr; }
  .dh-grid.g-split{ grid-template-columns:1fr 300px; }
  .dh-grid.g-cols2{ grid-template-columns:1fr 1fr; }
  .dh-grid > *{ min-width:0; }

  .dh-group{ display:flex; flex-direction:column; }
  .dh-group__hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
  .dh-group__ttl{ display:flex; align-items:center; gap:9px; font-family:var(--mw-font-cond); font-size:14px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mw-acc); }

  .dh-group__ct{ font-family:'Saira Condensed',monospace; font-size:13px; font-weight:700; color:var(--mw-acc); background:color-mix(in srgb,var(--mw-acc) 16%, transparent); padding:1px 9px; clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px); }

  /* handoff / blocked rail */
  .dh-rail__hd{ display:flex; align-items:center; gap:8px; font-family:var(--mw-font-cond); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--mw-cyan-bright); margin-bottom:12px; }
  .dh-rail__hd svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; }
  .dh-handoff{ display:flex; align-items:center; gap:7px; margin-top:8px; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mw-text-dim); }

  .dh-handoff__ar{ color:var(--mw-cyan); }

  @media (max-width:900px){
    .dh-grid.g-groups,.dh-grid.g-split,.dh-grid.g-cols2{ grid-template-columns:1fr; }
    .wrap{ padding:16px 14px 60px; }
  }
</style>

      {t_en:'Chiller CH-1 — refrigerant leak',t_mk:'Ладилник CH-1 — протекување',id:'MU-46',st:'stuck',attrs:[['Equip','CH-1'],['Sev','High']],tags:['urgent']} ]} }
};

/* ── render helpers ── */
function bilingual(en, mk){ return '<span class="en">'+en+'</span><span class="mk">'+mk+'</span>'; }

function card(c, acc){
  const done = c.st==='done';
  let meta = '';
  meta += '<span class="mw-tcard__dept">'+ (c.dab||'') +'</span>';
  meta += '<span class="mw-tcard__id">'+c.id+'</span>';
  (c.attrs||[]).forEach(a=> meta += '<span class="mw-attr">'+a[0]+' <b>'+a[1]+'</b></span>');
  (c.tags||[]).forEach(t=> meta += '<span class="mw-htag">#'+t+'</span>');
  if(c.sub) meta += '<span class="mw-sub"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'+c.sub[0]+'/'+c.sub[1]+'</span>';
  if(c.hrs) meta += '<span class="mw-sub">'+c.hrs+'h</span>';
  if(c.due) meta += '<span class="mw-due'+(c.over?' mw-due--over':'')+'">'+c.due+'</span>';
  if(c.from) meta += '<span class="dh-handoff"><span class="dh-handoff__b mw-attr">'+c.from+'</span><span class="dh-handoff__ar">→</span><span class="dh-handoff__b mw-attr">'+c.to+'</span></span>';
  const st = c.st ? '<span class="mw-st mw-st--'+c.st+'">'+c.st+'</span>' : '';
  return '<div class="mw-tcard'+(done?' mw-tcard--done':'')+'" style="--mw-acc:'+acc+';cursor:pointer" onclick="location.href=\'task-detail-'+current+'.html\'">'+
    '<span class="mw-tcard__box"></span>'+
    '<div class="mw-tcard__main"><div class="mw-tcard__title">'+bilingual(c.t_en,c.t_mk)+'</div>'+
      '<div class="mw-tcard__meta">'+meta+'</div></div>'+
    '<div class="mw-tcard__right">'+st+'</div></div>';
}

function group(g, acc, dab){
  const cards = g.cards.map(c=>card(Object.assign({dab},c),acc)).join('');
  return '<div class="mw-panel mw-panel--quiet dh-group" style="--mw-acc:'+acc+'">'+
    '<div class="dh-group__hd"><span class="dh-group__ttl"><span class="gdot"></span>'+bilingual(g.en,g.mk)+'</span>'+
    '<span class="dh-group__ct">'+g.cards.length+'</span></div>'+
    cards +'</div>';
}
function colPanel(g, acc, dab){
  const cards = g.cards.map(c=>card(Object.assign({dab},c),acc)).join('');
  return '<div class="mw-panel dh-group" style="--mw-acc:'+acc+'">'+
    '<div class="dh-group__hd"><span class="dh-group__ttl"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;">'+(IC[g.ic]||'')+'</svg>'+bilingual(g.en,g.mk)+'</span>'+
    '<span class="dh-group__ct">'+g.cards.length+'</span></div>'+
    cards +'</div>';
}
function rail(r, acc, dab){
  const cards = r.cards.map(c=>card(Object.assign({dab},c),acc)).join('');
  return '<div class="mw-panel dh-rail" style="--mw-acc:'+acc+'"><div class="dh-rail__hd"><svg viewBox="0 0 24 24">'+(IC[r.ic]||'')+'</svg>'+bilingual(r.en,r.mk)+'</div>'+cards+'</div>';
}

let current = 'tooling';
let empty = false;

function renderPicker(){
  document.getElementById('picker').innerHTML = DEPTS.map(d=>
    '<div class="dh-pick'+(d.c===current?' is-active':'')+'" data-dept="'+d.c+'" style="--dc:'+d.col+'">'+
    '<span class="dh-pick__dot"></span><b style="font-family:\'Saira Condensed\';letter-spacing:.06em;">'+d.ab+'</b>'+bilingual(d.en,d.mk)+'</div>'
  ).join('');
}
function renderHero(d, count){
  document.getElementById('hero').style.setProperty('--mw-acc', d.col);
  document.getElementById('hero').innerHTML =
    '<div class="dh-hero__ic"><svg viewBox="0 0 24 24">'+IC[d.ic]+'</svg></div>'+
    '<div><div class="dh-hero__name">'+bilingual(d.en,d.mk)+'</div>'+
    '<div class="dh-hero__sub">'+bilingual('Week 28 · Purely Plant — [TEST] site','Недела 28 · Purely Plant — [TEST] локација')+'</div></div>'+
    '<div class="dh-hero__stat"><div class="dh-hero__num">'+count+'</div><div class="dh-hero__numl">'+bilingual('tasks this week','задачи оваа недела')+'</div></div>';
}
function renderPresets(d){
  const list = PRESETS[d.c]||[];
  document.getElementById('presets').style.setProperty('--mw-acc', d.col);
  document.getElementById('presets').innerHTML = list.map(p=>
    '<button class="dh-preset" type="button"><span class="plus">+</span>'+bilingual(p[0],p[1])+'</button>'
  ).join('');
}

function renderBody(d){
  const data = DATA[d.c]; const acc = d.col; const dab = d.ab;
  const body = document.getElementById('body');
  document.getElementById('presets').style.display = '';

  if(empty){
    document.getElementById('presets').style.display = 'none';
    body.innerHTML = '<div class="mw-panel mw-empty" style="--mw-acc:'+acc+'">'+
      '<div class="mw-empty__ic" style="color:'+acc+';border-color:'+acc+'55"><svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;">'+IC[d.ic]+'</svg></div>'+
      '<div class="mw-empty__tt">'+bilingual('A fresh week — nothing planned yet','Нова недела — сè уште ништо')+'</div>'+
      '<div class="mw-empty__ds">'+bilingual('Tap a preset below to drop in this department\u2019s routine work, or create a task from scratch.','Допри пресет подолу за рутинска работа на овој оддел, или создади нова задача.')+'</div>'+
      '<div class="dh-empty__presets" style="--mw-acc:'+acc+'">'+
        (PRESETS[d.c]||[]).map(p=>'<button class="dh-preset" type="button"><span class="plus">+</span>'+bilingual(p[0],p[1])+'</button>').join('')+
      '</div></div>';
    return;
  }

  let html = '';
  if(data.groups){
    const groups = data.groups.map(g=>group(g,acc,dab)).join('');
    if(data.rail){
      html = '<div class="dh-grid g-split"><div class="dh-grid g-groups" style="align-content:start">'+groups+'</div>'+rail(data.rail,acc,dab)+'</div>';
    } else {
      html = '<div class="dh-grid g-groups">'+groups+'</div>';
    }
  } else if(data.cols){
    html = '<div class="dh-grid g-cols2">'+data.cols.map(g=>colPanel(g,acc,dab)).join('')+'</div>';
  }
  body.innerHTML = html;
}

function countTasks(d){
  const data = DATA[d.c]; let n = 0;
  (data.groups||[]).forEach(g=>n+=g.cards.length);
  (data.cols||[]).forEach(g=>n+=g.cards.length);
  if(data.rail) n += data.rail.cards.length;
  return n;
}

function render(){
  const d = DEPTS.find(x=>x.c===current);
  renderPicker(); renderHero(d, empty?0:countTasks(d)); renderPresets(d); renderBody(d);
}

/* dedicated per-department page — picker navigates to sibling depthome-*.html */
document.getElementById('picker').addEventListener('click', e=>{
  const el = e.target.closest('[data-dept]'); if(!el) return;
  if(el.getAttribute('data-dept')===current){ empty=false; render(); return; }
  location.href = 'depthome-'+el.getAttribute('data-dept')+'.html';
});
document.getElementById('emptyToggle').addEventListener('click', ()=>{ empty = !empty; render(); });

render();
</script>
<script src="mw-i18n.js"></script>
<script src="nav.js"></script>
</body>
</html>
