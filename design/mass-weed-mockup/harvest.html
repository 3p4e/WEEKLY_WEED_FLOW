<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASS WEED — Harvest Scheduler</title>
<link rel="stylesheet" href="mass-weed.css">
<style>
  html,body{margin:0;background:var(--mw-void);}
  .wrap{ max-width:1080px; margin:0 auto; padding:20px 24px 60px; }
  .hgrid{ display:grid; grid-template-columns:1.6fr 1fr; gap:16px; }
  /* Gantt timeline */
  .gantt{ display:flex; flex-direction:column; gap:0; }
  .gantt__head{ display:grid; grid-template-columns:150px 1fr; border-bottom:1px solid rgba(94,200,240,.2); padding-bottom:8px; margin-bottom:6px; }
  .gantt__weeks{ display:grid; grid-template-columns:repeat(12,1fr); }
  .gantt__wk{ font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--mw-text-dim); text-align:center; }
  .row{ display:grid; grid-template-columns:150px 1fr; align-items:center; padding:7px 0; border-bottom:1px solid rgba(94,200,240,.07); }
  .row__nm{ font-size:12px; color:var(--mw-ink); }
  .row__nm small{ display:block; color:var(--mw-text-dim); font-size:10px; text-transform:uppercase; letter-spacing:.05em; }
  .row__track{ position:relative; height:22px; }
  .bar{ position:absolute; top:3px; height:16px; border-radius:2px; display:flex; align-items:center; padding:0 7px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--mw-void); white-space:nowrap; overflow:hidden; }
  .bar--veg{ background:linear-gradient(90deg,#3fe0a0,#2fb888); }
  .bar--flower{ background:linear-gradient(90deg,#5ec8f0,#3a9fd4); }
  .bar--cure{ background:linear-gradient(90deg,#a879e0,#8a5cc8); }
  .today{ position:absolute; top:-4px; bottom:0; width:2px; background:var(--mw-cyan-bright); box-shadow:0 0 8px var(--mw-cyan-bright); z-index:5; }
  .today::before{ content:'NOW'; position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:8px; font-weight:700; color:var(--mw-cyan-bright); letter-spacing:.08em; }
  /* Upcoming list */
  .up{ display:flex; flex-direction:column; gap:10px; }
  .upcard{ background:rgba(58,159,212,.06); border:1px solid rgba(94,200,240,.16); border-left:3px solid var(--mw-cyan-bright); padding:12px 14px; clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); }
  .upcard__d{ font-family:'Saira Condensed',sans-serif; font-size:26px; font-weight:700; color:var(--mw-cyan-bright); line-height:1; }
  .upcard__d small{ font-size:12px; color:var(--mw-text-dim); font-weight:400; }
  .upcard__nm{ font-size:13px; color:var(--mw-ink); margin-top:5px; }
  .upcard__meta{ font-size:11px; color:var(--mw-text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .upcard--soon{ border-left-color:var(--mw-stat-mid); }
  .upcard--soon .upcard__d{ color:var(--mw-stat-mid); }
  .kpis{ display:flex; gap:12px; margin-bottom:16px; }
  .kpi{ flex:1; background:rgba(58,159,212,.07); border:1px solid rgba(94,200,240,.16); padding:12px 16px; clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px); }
  .kpi__v{ font-family:'Saira Condensed',sans-serif; font-size:30px; font-weight:700; color:var(--mw-ink); line-height:1; }
  .kpi__l{ font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--mw-text-dim); margin-top:5px; }
</style>
</head>
<body>
<div class="mw-root">
<div class="wrap" data-screen-label="Harvest Scheduler">
  <nav class="mw-nav">
    <span class="mw-nav__mark"></span><span class="mw-nav__brand">Mass Weed</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="environment.html">Climate</a>
    <a href="genetics.html">Genetics</a>
    <a href="nutrients.html">Nutrients</a>
    <a href="harvest.html" class="is-active">Harvest</a>
    <a href="cure.html">Cure</a>
    <a href="analytics.html">Analytics</a>
    <a href="packaging.html">Packaging</a>
    <a href="board.html">Cycle Board</a>
    <a href="login.html" style="margin-left:auto;">Sign Out</a>
  </nav>
  <div class="mw-header-bar"><span class="mw-rule"></span><h1 class="mw-title mw-title--xl">Harvest Scheduler</h1><span class="mw-rule"></span></div>

  <div class="kpis">
    <div class="kpi"><div class="kpi__v">6</div><div class="kpi__l">Active Cycles</div></div>
    <div class="kpi"><div class="kpi__v">2</div><div class="kpi__l">Harvests · 30d</div></div>
    <div class="kpi"><div class="kpi__v">14.2</div><div class="kpi__l">Est. kg Yield</div></div>
    <div class="kpi"><div class="kpi__v">83<span style="font-size:15px;">%</span></div><div class="kpi__l">Room Utilization</div></div>
  </div>

  <div class="hgrid">
    <div class="mw-panel">
      <div class="mw-label" style="margin-bottom:14px;">Cultivation Timeline · 12 Weeks</div>
      <div class="gantt">
        <div class="gantt__head">
          <div></div>
          <div class="gantt__weeks" id="wkhead"></div>
        </div>
        <div id="rows"></div>
      </div>
      <div style="display:flex;gap:18px;margin-top:14px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mw-text-dim);">
        <span><span style="display:inline-block;width:10px;height:10px;background:#3fe0a0;border-radius:2px;vertical-align:middle;margin-right:5px;"></span>Veg</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#5ec8f0;border-radius:2px;vertical-align:middle;margin-right:5px;"></span>Flower</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#a879e0;border-radius:2px;vertical-align:middle;margin-right:5px;"></span>Dry / Cure</span>
      </div>
    </div>

    <div class="mw-panel">
      <div class="mw-label" style="margin-bottom:14px;">Upcoming Harvests</div>
      <div class="up" id="up"></div>
    </div>
  </div>
</div>
</div>
<script>
  const NOW=4.4; // current week position (0-12)
  // rows: [name, strain, zone, veg[start,end], flower[start,end], cure[start,end]]
  const cycles=[
    ['Batch F-12','Citadel Kush','Flower A',[-3,0],[0,3.2],[3.2,4.2]],
    ['Batch F-09','Reaper Haze','Flower B',[-2,1.2],[1.2,4.6],[4.6,5.6]],
    ['Batch F-15','Omega Relay','Flower C',[0,2.8],[2.8,6.4],[6.4,7.4]],
    ['Batch V-04','Element Zero','Veg 1',[2.4,5.8],[5.8,9.4],[9.4,10.4]],
    ['Batch V-07','Thresher Purple','Veg 2',[4,7.4],[7.4,11],[11,12]],
    ['Batch S-02','Nova Diesel','Clone',[5.6,9],[9,12],[12,12]]
  ];
  const wk=document.getElementById('wkhead');
  wk.innerHTML=Array.from({length:12},(_, i)=>`<div class="gantt__wk">W${i+1}</div>`).join('');
  const clamp=v=>Math.max(0,Math.min(12,v));
  const pct=v=>(clamp(v)/12*100);
  document.getElementById('rows').innerHTML=cycles.map(c=>{
    const seg=(range,cls,lbl)=>{
      const a=pct(range[0]),b=pct(range[1]); if(b<=a)return '';
      return `<div class="bar bar--${cls}" style="left:${a}%;width:${b-a}%">${(b-a)>7?lbl:''}</div>`;
    };
    return `<div class="row">
      <div class="row__nm">${c[0]}<small>${c[1]} · ${c[2]}</small></div>
      <div class="row__track">
        ${seg(c[3],'veg','Veg')}${seg(c[4],'flower','Flower')}${seg(c[5],'cure','Cure')}
        <div class="today" style="left:${pct(NOW)}%"></div>
      </div></div>`;
  }).join('');
  const up=[
    ['3','days','Batch F-12 · Citadel Kush','Flower A · ~2.4 kg','soon'],
    ['11','days','Batch F-09 · Reaper Haze','Flower B · ~2.9 kg',''],
    ['24','days','Batch F-15 · Omega Relay','Flower C · ~3.1 kg','']
  ];
  document.getElementById('up').innerHTML=up.map(u=>`
    <div class="upcard ${u[4]==='soon'?'upcard--soon':''}">
      <div class="upcard__d">${u[0]} <small>${u[1]}</small></div>
      <div class="upcard__nm">${u[2]}</div>
      <div class="upcard__meta">${u[3]}</div>
    </div>`).join('');
</script>
<script src="nav.js"></script>
</body>
</html>
