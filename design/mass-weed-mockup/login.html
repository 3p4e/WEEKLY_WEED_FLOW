<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASS WEED — Secure Access</title>
<link rel="stylesheet" href="mass-weed.css">
<style>
  html,body{margin:0;height:100%;background:var(--mw-void);overflow:hidden;}
  .login{ position:fixed; inset:0; display:grid; grid-template-columns:1fr 1fr; }
  .side{ position:relative; padding:40px 46px; display:flex; flex-direction:column; justify-content:center; }
  .side--log{ border-right:1px solid rgba(58,159,212,.15); }
  .bootlog{ font-family:'Saira Condensed',monospace; font-size:13px; line-height:1.9; color:var(--mw-text-dim); letter-spacing:.03em; }
  .bootlog .ok{ color:var(--mw-digit); } .bootlog .warn{ color:var(--mw-stat-mid); } .bootlog .hd{ color:var(--mw-cyan-bright); }
  .brand{ font-family:'Saira Condensed',sans-serif; font-weight:700; letter-spacing:.24em; text-transform:uppercase; font-size:46px; color:var(--mw-cyan-bright); text-shadow:0 0 26px rgba(94,200,240,.6); line-height:1; }
  .brand small{ display:block; font-size:12px; letter-spacing:.34em; color:var(--mw-text-dim); margin-top:10px; font-weight:400; }
  .brandrow{ display:flex; align-items:center; gap:18px; }
  .brandleaf{ width:96px; height:96px; flex:none; }
  .loginpanel{ width:360px; max-width:80%; }
  .cursor::after{ content:"▌"; color:var(--mw-cyan); animation:mw-flicker 1.1s steps(1) infinite; }
</style>
</head>
<body>
<div class="mw-root">
<div class="login" data-screen-label="Secure Access">
  <div class="side side--log">
    <div class="brandrow">
      <div class="mw-leaf brandleaf" data-mw-leaf data-size="mini"></div>
      <div class="brand">Mass&nbsp;Weed<small>Cultivation Command · Node 7</small></div>
    </div>
    <div class="bootlog" style="margin-top:36px;">
      <div><span class="hd">▸ BIOS</span> hydroponic control mesh … <span class="ok">ONLINE</span></div>
      <div><span class="hd">▸ ENV</span> climate array 12/12 zones … <span class="ok">NOMINAL</span></div>
      <div><span class="hd">▸ SEC</span> vault seals · chain-of-custody … <span class="ok">LOCKED</span></div>
      <div><span class="hd">▸ INV</span> 128 strains · 46 batches indexed … <span class="ok">SYNCED</span></div>
      <div><span class="hd">▸ CMP</span> METRC reconcile pending … <span class="warn">2 FLAGS</span></div>
      <div class="cursor"><span class="hd">▸ AUTH</span> awaiting operator&nbsp;</div>
    </div>
  </div>
  <div class="side" style="align-items:center;">
    <div class="mw-panel loginpanel">
      <div class="mw-header-bar"><span class="mw-rule"></span><h2 class="mw-title mw-title--lg">Secure Access</h2><span class="mw-rule"></span></div>
      <div class="mw-field"><label>Operator ID</label><input class="mw-input" id="uid" placeholder="e.g. SHEPARD-N7" autocomplete="off"></div>
      <div class="mw-field"><label>Passphrase</label><input class="mw-input" id="pwd" type="password" placeholder="••••••••••"></div>
      <button class="mw-btn mw-btn--wide" style="margin-top:8px;" onclick="location.href='dashboard.html'">Authenticate</button>
      <div style="display:flex; justify-content:space-between; margin-top:16px;">
        <button class="mw-tabbtn">Biometric</button>
        <button class="mw-tabbtn">Request Access</button>
      </div>
    </div>
  </div>
</div>
</div>
<script type="module" src="mw-leaf.js"></script>
</body>
</html>
