<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>GrowFlow — Production Task Manager</title>
  <link rel="icon" type="image/png" href="assets/pp-leaf.png">
  <link rel="stylesheet" href="gf/app.css">
  <link rel="stylesheet" href="gf/brand.css">
  <link rel="stylesheet" href="gf/mobile.css">
  <link rel="stylesheet" href="gf/views.css">
  <link rel="stylesheet" href="gf/leaf-fx.css">
</head>
<body>
<div id="app">
  <!-- ───────────── Sidebar ───────────── -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand" style="gap:13px">
      <span class="leaf-stage" id="brand-leaf" data-mode="calm" style="width:62px;height:72px" title="Click me">
        <span class="leaf-3d"><span class="leaf-float"><span class="pp-leaf-anim"></span></span></span>
      </span>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <div class="gf-name" style="font-size:21px"><span class="gf-grow-word">Grow</span><b>Flow</b></div>
        <span class="pp-wordmark" style="width:118px;height:20px" title="Purely Plant — The Future of Cannabis"></span>
      </div>
    </div>

    <nav id="nav"></nav>

    <div class="side-divider"></div>
    <div class="side-label" id="side-label">Departments</div>
    <div class="dept-list" id="dept-list"></div>

    <div style="flex:1"></div>
    <div class="user-card" id="user-card" onclick="GF.openSettings()"></div>
  </aside>

  <!-- ───────────── Main ───────────── -->
  <div class="main">
    <header class="header">
      <button class="btn-ghost hamburger" id="hamburger">
        <svg class="icon" viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <h2 class="gf-mark">
        <span class="leaf-stage" id="header-leaf" data-mode="calm" style="width:30px;height:35px" title="Click me">
          <span class="leaf-3d"><span class="leaf-float"><span class="pp-leaf-anim"></span></span></span>
        </span>
        <span class="gf-name" style="font-size:21px"><span class="gf-grow-word">Grow</span><b>Flow</b></span>
      </h2>
      <div class="search" style="margin-left:16px">
        <svg class="icon" viewBox="0 0 20 20"><path d="M17 17l-3.2-3.2M15.5 9.5a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
        <input id="search-input" placeholder="Search tasks, batches, rooms…">
      </div>
      <div class="spacer"></div>
      <div class="lang-toggle">
        <span id="lang-en" class="on" onclick="GF.setLang('en')">EN</span>
        <span id="lang-mk" onclick="GF.setLang('mk')">МК</span>
      </div>
      <button class="btn btn-primary btn-sm" id="newtask-btn" onclick="GF.openAdd(GF.state.selWeek)">
        <svg class="icon" viewBox="0 0 20 20" style="stroke:currentColor"><path d="M10 4v12M4 10h12"/></svg>
        <span id="newtask-label">New task</span>
      </button>
      <button class="btn btn-orange btn-sm" id="voice-btn" onclick="GF.voice.openCapture(GF.state.selWeek)">
        <svg class="icon" viewBox="0 0 20 20" style="stroke:#fff"><path d="M10 3a2.2 2.2 0 012.2 2.2v4.6a2.2 2.2 0 01-4.4 0V5.2A2.2 2.2 0 0110 3zM5 9.5a5 5 0 0010 0M10 14.5V17M7.5 17h5"/></svg>
        <span id="voice-btn-label">Voice task</span>
      </button>
      <button class="icon-btn" id="assistant-btn" title="Assistant" onclick="GF.assistant.open()">
        <svg class="icon" viewBox="0 0 20 20" style="stroke:var(--orange)"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6L10 3z"/></svg>
      </button>
      <button class="btn btn-sm" onclick="GF.goToday()">Today</button>
      <button class="icon-btn" onclick="GF.openSettings()" title="Settings">
        <svg class="icon" viewBox="0 0 20 20"><path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM10 2.5v2M10 15.5v2M3.5 6l1.7 1M14.8 13l1.7 1M3.5 14l1.7-1M14.8 7l1.7-1"/></svg>
      </button>
      <div id="header-avatar"></div>
    </header>

    <div class="workspace">
      <div id="week-strip" class="week-strip"></div>
      <div id="day-pills" class="day-pills"></div>
      <div id="telemetry" class="telemetry"></div>
      <div id="panels" class="panels"></div>
    </div>
  </div>
</div>

<!-- Toasts -->
<div id="toasts"></div>

<!-- ═══ AI Assistant drawer ═══ -->
<div class="assistant-overlay" id="assistant-overlay" onclick="GF.assistant.close()"></div>
<aside class="assistant-drawer" id="assistant-drawer" aria-label="GrowFlow Assistant">
  <div class="asst-head">
    <span class="pp-leaf"></span>
    <div style="flex:1;min-width:0">
      <div class="asst-title">GrowFlow <span class="asst-tag">Assistant</span></div>
    </div>
    <button class="btn-ghost" onclick="GF.assistant.close()"><svg class="icon" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <div class="asst-body" id="assistant-body"></div>
  <div class="asst-foot">
    <input id="assistant-input" placeholder="Ask anything…" onkeydown="if(event.key==='Enter')GF.assistant.send()">
    <button class="btn btn-primary btn-sm" onclick="GF.assistant.send()"><svg class="icon" viewBox="0 0 20 20" style="stroke:#fff"><path d="M4 10h12M11 5l5 5-5 5"/></svg></button>
  </div>
</aside>

<!-- ═══ User create / edit modal (Team) ═══ -->
<div class="overlay" id="user-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-head"><h3 id="user-title">Add person</h3>
      <button class="btn-ghost" onclick="GF.closeModal('user-modal')"><svg class="icon" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div class="modal-body" id="user-body"></div>
    <div class="modal-foot"><button class="btn" onclick="GF.closeModal('user-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="GF.submitUser()">Save</button></div>
  </div>
</div>

<!-- ═══ Voice capture ═══ -->
<div class="overlay" id="voice-modal">
  <div class="modal voice-modal" style="max-width:440px">
    <div class="modal-head"><h3 style="color:#fff">Voice task</h3>
      <button class="btn-ghost" style="color:rgba(255,255,255,.7)" onclick="GF.closeModal('voice-modal')">
        <svg class="icon" viewBox="0 0 20 20" style="stroke:currentColor"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div class="modal-body" id="voice-content" style="padding:0 22px 22px"></div>
  </div>
</div>

<!-- ═══ AI summary ═══ -->
<div class="overlay" id="ai-modal">
  <div class="modal"><div class="modal-head"><h3>AI Summary</h3>
    <button class="btn-ghost" onclick="GF.closeModal('ai-modal')"><svg class="icon" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div class="modal-body" id="ai-out" style="min-height:120px"></div>
    <div class="modal-foot"><button class="btn" onclick="GF.closeModal('ai-modal')">Close</button></div></div>
</div>

<!-- ═══ Export ═══ -->
<div class="overlay" id="export-modal">
  <div class="modal" style="max-width:380px"><div class="modal-head"><h3 id="export-title">Export</h3>
    <button class="btn-ghost" onclick="GF.closeModal('export-modal')"><svg class="icon" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
      <button class="btn" style="width:100%;justify-content:center" onclick="GF.export.run('csv')">
        <svg class="icon" viewBox="0 0 20 20"><path d="M4 6h12v11H4zM4 6V4m12 2V4M7 3v3m6-3v3M4 9h12"/></svg>Export CSV</button>
      <button class="btn" style="width:100%;justify-content:center" onclick="GF.export.run('json')">
        <svg class="icon" viewBox="0 0 20 20"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z"/></svg>Export JSON</button>
      <button class="btn" style="width:100%;justify-content:center" onclick="GF.export.run('pdf')">
        <svg class="icon" viewBox="0 0 20 20"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6L10 3z"/></svg>Export PDF</button>
    </div>
  </div>
</div>

<!-- ═══ Add task ═══ -->
<div class="overlay" id="add-modal">
  <div class="modal"><div class="modal-head"><h3>New task</h3>
    <button class="btn-ghost" onclick="GF.closeModal('add-modal')"><svg class="icon" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div class="modal-body" id="add-body"></div>
    <div class="modal-foot"><button class="btn" onclick="GF.closeModal('add-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="GF.submitAdd()">Create task</button></div></div>
</div>

<!-- Live design-tweaks panel mount -->
<div id="tweaks-root"></div>

<!-- Scripts — load order matters: boot-guard → data → core → render → voice → export → views → leaf-fx → assistant → main
     → api → integrate → audit-view → collab → report-view → tweaks-vanilla.
     audit-view/collab/report-view are integrate.js's monkey-patch pattern split
     into per-concern files (first decomposition cut); collab.js's canManageTask
     reads AUDIT_ROLES (a bare top-level const declared in audit-view.js) — classic
     <script> tags share one lexical scope in document order, so audit-view must
     load before collab. -->
<script src="gf/boot-guard.js"></script>
<script src="gf/data.js"></script>
<script src="gf/core.js"></script>
<script src="gf/render.js"></script>
<script src="gf/voice.js"></script>
<script src="gf/export.js"></script>
<script src="gf/views.js"></script>
<script src="gf/leaf-fx.js"></script>
<script src="gf/assistant.js"></script>
<script src="gf/main.js"></script>
<script src="gf/api.js"></script>
<script src="gf/integrate.js"></script>
<script src="gf/audit-view.js"></script>
<script src="gf/collab.js"></script>
<script src="gf/report-view.js"></script>
<script src="gf/tweaks-vanilla.js"></script>
</body>
</html>
