<!doctype html>
<html lang="en" data-theme="mass-weed">
<head>
  <!-- Set the real theme before any CSS paints — reading it later (after
       stylesheets load) would flash the wrong theme for a light-mode user. -->
  <script>try{
    /* Mirrors GF.THEME_CORE + GF.THEMES (core.js) — kept in sync by hand since
       this must run before core.js loads. A saved id outside this full set
       (retired skin, corruption, a typo) is HEALED here, synchronously, same
       as the exclusive-Mass-Weed era's boot script: reset to the default and
       overwrite storage, so an invalid value can never paint unstyled. */
    var CORE=['dark','light','suma','mass-weed','mass-weed-light'];
    var CARBON=['blurple-chat','blush-slate-dark','code-forge','digital-rain','ebony-amber','forest','heart-of-darkness','indigo-turquoise','lambda-core','mocha-paws','nightfang','nord','nordic','solo-night','tropical-midnight','vapor-classic','vapor-deck','amber-glow-light','aurora-light','azure-silence-light','blush-slate-light','console-horizon-light','jade-matrix-light','jade-mint-light','kawaii','miami-neon-light','playlist-mint-light','retro-98','steel-mist-light','winter-blush-light'];
    var t=localStorage.getItem('gf_theme');
    if(t&&CORE.indexOf(t)<0&&CARBON.indexOf(t)<0){t='mass-weed';try{localStorage.setItem('gf_theme','mass-weed');}catch(e){}}
    if(t){var r=document.documentElement;r.dataset.theme=t;if(CORE.indexOf(t)<0)r.setAttribute('data-skin-carbon','');else r.removeAttribute('data-skin-carbon');}
  }catch(e){}</script>
  <meta charset="utf-8">
  <!-- no maximum-scale: pinch-zoom must stay available (a11y) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GrowFlow — Production Task Manager</title>
  <link rel="icon" type="image/png" href="assets/pp-leaf.png">
  <!-- PWA: installable app shell (see manifest.webmanifest + sw.js) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#060F0B">
  <link rel="apple-touch-icon" href="assets/wwf-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="gf/app.css">
  <link rel="stylesheet" href="gf/skins.css">
  <link rel="stylesheet" href="gf/brand.css">
  <link rel="stylesheet" href="gf/mobile.css">

<div id="app">

        <span class="pp-wordmark" style="width:118px;height:20px" title="Purely Plant — The Future of Cannabis"></span>
      </div>
    </div>

    <div class="side-scroll">
      <nav id="nav"></nav>

      <div class="side-divider"></div>
      <div class="side-label" id="side-label">Departments</div>
      <div class="dept-list" id="dept-list"></div>

  <!-- ───────────── Main ───────────── -->

        </span>
        <span class="gf-name" style="font-size:21px"><span class="gf-grow-word">Grow</span><b>Flow</b></span>
      </h2>
      <div class="search" style="margin-left:16px">
        <svg class="icon" viewBox="0 0 20 20"><path d="M17 17l-3.2-3.2M15.5 9.5a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
        <input id="search-input" placeholder="Search tasks…">
      </div>
      <div class="spacer"></div>
      <div class="lang-toggle">
        <span id="lang-en" class="on" onclick="GF.setLang('en')">EN</span>
        <span id="lang-mk" onclick="GF.setLang('mk')">МК</span>
      </div>
      <button class="btn btn-primary btn-sm" id="newtask-btn" onclick="GF.openAdd(GF.state.selWeek)">
        <svg class="icon" viewBox="0 0 20 20" style="stroke:currentColor"><path d="M10 4v12M4 10h12"/></svg>

      <button class="btn btn-orange btn-sm" id="voice-btn" onclick="GF.voice.openCapture(GF.state.selWeek)">

        <span id="voice-btn-label">Voice task</span>
      </button>
      <button class="icon-btn" id="assistant-btn" title="Assistant" onclick="GF.assistant.open()">
        <svg class="icon" viewBox="0 0 20 20" style="stroke:var(--orange)"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6L10 3z"/></svg>
      </button>
      <button class="btn btn-sm" id="today-btn" onclick="GF.goToday()">Today</button>
      <button class="icon-btn" id="theme-btn" onclick="GF.toggleTheme()" title="Themes"></button>
      <button class="icon-btn" onclick="GF.openSettings()" title="Settings">
        <svg class="icon" viewBox="0 0 20 20"><path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM10 2.5v2M10 15.5v2M3.5 6l1.7 1M14.8 13l1.7 1M3.5 14l1.7-1M14.8 7l1.7-1"/></svg>
      </button>

    </header>

    <div class="workspace">

      <div id="day-pills" class="day-pills"></div>

</div>

<!-- ═══ AI Assistant drawer ═══ -->
<div class="assistant-overlay" id="assistant-overlay" onclick="GF.assistant.close()"></div>

<script>
// PWA: register the version-keyed service worker (sw.js) — app shell works offline.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  // sw.js calls skipWaiting()+clients.claim() so a new deploy takes over
  // instantly (by design — see sw.js's VERSION comment), but that means an
  // ALREADY-OPEN tab keeps running its old in-memory JS/DOM under the new
  // worker for a moment: a stale-code/new-shell version mix. Reload once
  // control actually changes hands so that window is momentary rather than a
  // lingering mismatched session; guarded so a mid-reload SW swap can't loop.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true;
    location.reload();
  });
}
</script>
