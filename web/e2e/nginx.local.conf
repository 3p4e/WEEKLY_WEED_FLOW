# Local-only variant of ../nginx.conf for running Playwright e2e tests
# without Docker: same path-based proxy rules as production, but pointed at
# 127.0.0.1 instead of the Docker-internal backend hostname. Never deployed
# — production always uses ../nginx.conf inside the frontend image.
worker_processes 1;
error_log stderr notice;
pid /tmp/wwf-e2e-nginx.pid;

events { worker_connections 64; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # Keep all runtime scratch under /tmp so nginx can run as an unprivileged
    # user, not just root: its compiled-in default temp paths live under
    # root-owned /var/lib/nginx, which a non-root e2e runner can't create
    # (nginx auto-creates these on start). No behavioural effect on the proxy.
    client_body_temp_path /tmp/wwf-e2e-nginx/body;
    proxy_temp_path       /tmp/wwf-e2e-nginx/proxy;
    fastcgi_temp_path     /tmp/wwf-e2e-nginx/fastcgi;
    uwsgi_temp_path       /tmp/wwf-e2e-nginx/uwsgi;
    scgi_temp_path        /tmp/wwf-e2e-nginx/scgi;

    server {
        listen 127.0.0.1:8091;
        server_name _;

        root __WEB_ROOT__;
        index index.html;

        location = /manifest.webmanifest {
            default_type application/manifest+json;
        }

        location ~ ^/(auth|departments|weeks|tasks|sessions|capture|ai|audit|reports|notifications|activity|facility|approvals|qms|qc|health) {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
