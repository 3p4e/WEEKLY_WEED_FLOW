# WWF GrowFlow frontend — serve the GrowFlow UI and proxy API calls (same-origin)
# to the WEEKLY_WEED_FLOW backend so the design talks to the real DB + Letta.

# The client address the backend sees. The chain is client -> Traefik -> this
# nginx -> uvicorn, and uvicorn (FORWARDED_ALLOW_IPS = this container's fixed
# internal IP) takes the RIGHTMOST X-Forwarded-For entry it does not trust.
# $proxy_add_x_forwarded_for appended Traefik's address to Traefik's own
# "<client>" header, so uvicorn resolved EVERY request to Traefik and the
# whole facility shared one login rate-limit bucket (review 2026-09-27,
# BC-01).
#
# Trust is keyed on TRAEFIK ITSELF, never on an interface or a subnet. The
# first fix trusted the header on any request that did not arrive over the
# internal-network interface, on the premise that only Traefik reaches the
# other one — but every container on traefik_network reaches it too, so a
# compromised sibling there (the internet-exposed capture connector is the
# threat the compose comment names) could send a fresh X-Forwarded-For per
# request and never fill the per-IP login bucket (review 2026-09-27,
# R2-BC-03). Now the realip module rewrites $remote_addr from
# X-Forwarded-For ONLY when the direct peer is a trusted proxy, and the
# trusted proxies are the addresses the Traefik container resolves to at
# start (docker-entrypoint.d/05-wwf-realip.sh writes them as
# set_real_ip_from lines into /etc/nginx/wwf-realip.d/, and re-resolves
# them while running). Every proxied location then forwards exactly ONE
# address, $remote_addr: the real client behind Traefik, or the direct peer
# itself for anything that did not come through Traefik — a sibling
# container's own address, whatever header it sent. Fail-safe: when the
# Traefik name cannot be resolved nothing is trusted, every request keeps
# Traefik's address and the facility shares one bucket (BC-01's symptom,
# loudly logged at start) rather than a spoofable one.

server {
    listen 80;
    server_name _;

    # The trusted-proxy list (set_real_ip_from ...) lives in the snippet the
    # entrypoint script writes from the resolved Traefik address. The
    # wildcard include tolerates an empty directory: no snippet = no trust.
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/wwf-realip.d/*.conf;

    # Don't disclose the nginx version in Server: headers / error pages —
    # version disclosure is free reconnaissance for an attacker.
    server_tokens off;

    # Explicit request-body ceiling (M9). nginx's stock default is 1 MB, which is
    # BOTH too small (it would 413 a legitimate scanned-CoA eCoA original, base64
    # up to ~27 MB for the 20 MB decoded cap) AND left implicit. Set it explicitly
    # to the same 32 MB ceiling the backend enforces (app/main.py limit_body_size):
    # large enough for the one genuine upload path (/qc/.../originals), bounded so
    # an over-large body is rejected at the edge before it is ever buffered.
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening. nosniff stops MIME-confusion on the JS/CSS this app
    # is entirely built from. frame-ancestors 'self' blocks clickjacking of the
    # authenticated exec app while still allowing the SAME-ORIGIN design/edit
    # harness (web/gf/tweaks-vanilla.js, design-mode only) to embed it.
    #
    # CSP: the shell's idiom is inline on*-handlers and style="" attributes, so
    # script-src/style-src need 'unsafe-inline'. The enforcement value here is
    # connect-src/object-src/base-uri — an injected script can run but cannot
    # phone home, load plugins, or re-base relative URLs. Google Fonts is the
    # app's ONLY external origin (app.css @import); everything else, incl.
    # three.js, is vendored. (This used to say "keep in sync with
    # web-next/nginx.conf" — web-next/ was deleted, so this file is now the
    # only copy and there is nothing left to sync it against.)
    #
    # NOTE: nginx add_header does NOT inherit into any location that declares
    # its own add_header — the static-assets block below must re-assert ALL of
    # these, not just nosniff.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Resolve the backend at REQUEST time (Docker embedded DNS) so nginx still
    # boots if the backend isn't resolvable yet at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # PWA manifest content-type (.webmanifest is not in the stock mime.types map)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Real backend API (FastAPI: auth, departments, weeks, tasks, sessions, ai)
    # AI Intake extraction is a heavy multi-task reasoning call (the backend
    # allows up to 150s) — give this one path a longer read timeout so nginx
    # doesn't 504 before the agent answers. Listed first so it wins the match.
    location ~ ^/intake(/|$) {
        set $wwf_backend http://weekly_weed_flow-backend-1:8000;
        proxy_pass         $wwf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # DocEngine Studio's agent routes, for exactly the reason /intake above has
    # its own block: the backend allows 150s for a chat turn and 120s for a
    # build+verify, but the general API location below reads for only 60s — so
    # every one of those calls was capped at 60s by this proxy and 504'd well
    # before the backend gave up, making the backend's own limits unreachable.
    # A read timeout is a ceiling, not a delay: fast calls on these paths are
    # unaffected. Listed before the general block so it wins the match.
    # (/qms/rag-query was listed here after its route was retired with the
    # legacy qms-api proxy — review 2026-09-27, R2-BC-09; web/gf/api.js keeps
    # the mirror list, _SLOW_PATHS.)
    location ~ ^/qms/studio/(build|workflows/[^/]+/(chat|revise))$ {
        set $wwf_backend http://weekly_weed_flow-backend-1:8000;
        proxy_pass         $wwf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # `handoffs` was MISSING here while POST /handoffs/{id}/resolve was live in
    # the client (GF.API.resolveHandoff). It fell through to the SPA location
    # below, where the static handler answers a POST with 405 — verified against
    # production 2026-07-30: this path returned 405 while POST
    # /tasks/{id}/handoffs returned 401, so resolving a cross-department handoff
    # had never once reached the backend. tests/frontend/sw-api-routes.test.js now
    # asserts every prefix api.js calls is proxied here.
    location ~ ^/(auth|departments|weeks|tasks|sessions|capture|ai|audit|reports|notifications|activity|handoffs|facility|cultivation|decon|waste|approvals|qms|qc|demo|health)(/|$) {
        set $wwf_backend http://weekly_weed_flow-backend-1:8000;
        proxy_pass         $wwf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: everything else serves the GrowFlow app
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|svg|woff2?)$ {
        expires 5m;
        add_header Cache-Control "public";
        # add_header in a location does NOT inherit the server-level ones, so
        # re-assert the full hardening set here (JS/CSS is exactly where
        # nosniff matters, and HSTS should ride on every response).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
