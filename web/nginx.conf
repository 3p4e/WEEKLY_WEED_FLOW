# WWF GrowFlow frontend — serve the GrowFlow UI and proxy API calls (same-origin)
# to the WEEKLY_WEED_FLOW backend so the design talks to the real DB + Letta.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend at REQUEST time (Docker embedded DNS) so nginx still
    # boots if the backend isn't resolvable yet at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Real backend API (FastAPI: auth, departments, weeks, tasks, ai)
    location ~ ^/(auth|departments|weeks|tasks|ai|audit|reports|health) {
        set $wwf_backend http://weekly_weed_flow-backend-1:8000;
        proxy_pass         $wwf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: everything else serves the GrowFlow app
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|svg|woff2?)$ {
        expires 5m;
        add_header Cache-Control "public";
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
