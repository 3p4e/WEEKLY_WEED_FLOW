# WWF web — serve the static task-tracker and proxy AI calls to the gateway,
# so the whole app is same-origin (set the AI backend URL in Settings to this site).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gateway API (FastAPI + Letta) — same-origin proxy
    location ~ ^/(ai|agents|health) {
        proxy_pass         http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Long cache for fingerprint-free static (kept short so updates show quickly)
    location ~* \.(css|js|png|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
