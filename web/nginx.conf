# WWF GrowFlow frontend — serve the GrowFlow UI and proxy API calls (same-origin)
# to the WEEKLY_WEED_FLOW backend so the design talks to the real DB + Letta.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening. nosniff stops MIME-confusion on the JS/CSS this app
    # is entirely built from. frame-ancestors 'self' blocks clickjacking of the
    # authenticated exec app while still allowing the SAME-ORIGIN design/edit
    # harness (web/gf/tweaks-vanilla.js, design-mode only) to embed it.
    #
    # CSP: the shell's idiom is inline on*-handlers and style="" attributes, so
    # script-src/style-src need 'unsafe-inline'. The enforcement value here is
    # connect-src/object-src/base-uri — an injected script can run but cannot
    # phone home, load plugins, or re-base relative URLs. Google Fonts is the
    # app's ONLY external origin (app.css @import); everything else, incl.
    # three.js, is vendored. Keep this list in sync with web-next/nginx.conf.
    #
    # NOTE: nginx add_header does NOT inherit into any location that declares
    # its own add_header — the static-assets block below must re-assert ALL of
    # these, not just nosniff.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Resolve the backend at REQUEST time (Docker embedded DNS) so nginx still
    # boots if the backend isn't resolvable yet at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # PWA manifest content-type (.webmanifest is not in the stock mime.types map)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Real backend API (FastAPI: auth, departments, weeks, tasks, sessions, ai)
    # AI Intake extraction is a heavy multi-task reasoning call (the backend
    # allows up to 150s) — give this one path a longer read timeout so nginx
    # doesn't 504 before the agent answers. Listed first so it wins the match.
    location ~ ^/intake(/|$) {
        set $wwf_backend http://weekly_weed_flow-backend-1:8000;
        proxy_pass         $wwf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ~ ^/(auth|departments|weeks|tasks|sessions|capture|ai|audit|reports|notifications|activity|health)(/|$) {
        set $wwf_backend http://weekly_weed_flow-backend-1:8000;
        proxy_pass         $wwf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: everything else serves the GrowFlow app
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|svg|woff2?)$ {
        expires 5m;
        add_header Cache-Control "public";
        # add_header in a location does NOT inherit the server-level ones, so
        # re-assert the full hardening set here (JS/CSS is exactly where
        # nosniff matters, and HSTS should ride on every response).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
