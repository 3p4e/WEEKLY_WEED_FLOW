# GrowFlow redesign (web-next) — serve the static SPA and proxy API calls
# (same-origin) to the WEEKLY_WEED_FLOW backend so the design talks to the real
# DB + Letta, identical to web/nginx.conf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same hardening set as web/nginx.conf (see comments there for rationale;
    # Google Fonts is the only external origin — typography.css @import).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Resolve the backend at REQUEST time (Docker embedded DNS) so nginx still
    # boots if the backend isn't resolvable yet at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # AI Intake extraction is a heavy multi-task reasoning call — longer timeout.
    location ~ ^/intake(/|$) {
        set $wwf_backend http://weekly_weed_flow-backend-1:8000;
        proxy_pass         $wwf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ~ ^/(auth|departments|weeks|tasks|sessions|capture|ai|audit|reports|notifications|activity|facility|approvals|qms|qc|health)(/|$) {
        set $wwf_backend http://weekly_weed_flow-backend-1:8000;
        proxy_pass         $wwf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: everything else serves the GrowFlow app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|svg|glb|obj|woff2?)$ {
        expires 5m;
        add_header Cache-Control "public";
        # add_header does not inherit into locations that set their own —
        # re-assert the full set (matches web/nginx.conf).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
